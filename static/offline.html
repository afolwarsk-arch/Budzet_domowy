<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brak połączenia — Wiem</title>
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    /* Strona serwowana z cache przy braku sieci — bez zależności zewnętrznych,
       bez auth.js. Musi działać, gdy nie działa nic innego. */
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 24px;
    }
    .box {
      background: var(--surface); border-radius: 16px; padding: 36px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; max-width: 340px;
    }
    .ikona { font-size: 44px; line-height: 1; margin-bottom: 14px; }
    h1 { font-size: 1.25rem; margin: 0 0 10px; }
    p { font-size: 0.92rem; line-height: 1.6; color: var(--muted); margin: 0 0 22px; }
    button {
      padding: 11px 26px; background: var(--primary); color: var(--on-primary); border: none;
      border-radius: 9px; cursor: pointer; font-size: 0.92rem; font-weight: 600;
    }
    button:active { background: var(--primary);color:var(--on-primary); }
  </style>
</head>
<body>
  <div class="box">
    <div class="ikona">📡</div>
    <h1>Brak połączenia</h1>
    <p>
     w<span class="lg-i">ı<i class="lg-kropka"></i></span>em<i class="lg-kropka"></i> potrzebuje internetu, żeby pokazać aktualne dane.
      Sprawdź zasięg albo Wi-Fi i spróbuj ponownie.
    </p>
    <button onclick="location.reload()">Spróbuj ponownie</button>
  </div>
  <script>
    // Gdy sieć wróci sama, nie każemy użytkownikowi klikać.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
