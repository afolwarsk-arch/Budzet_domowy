<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Zadania — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <style>
    .gora { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .gora h1 { margin: 0; font-size: 1.25rem; }

    .filtry { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
            padding: 7px 12px; min-height: 38px; font: inherit; font-size: 12.5px;
            cursor: pointer; color: var(--text); display: inline-flex; align-items: center;
            gap: 6px; }
    .chip[aria-pressed="true"] { border-color: var(--marka); background: var(--surface-2);
            font-weight: 600; }

    .szybkie { display: flex; gap: 8px; margin-bottom: 16px; }
    .szybkie input { flex: 1; min-height: 46px; }

    /* Znacznik zadania powtarzalnego — bez niego nie widać, że sprawa wróci
       po odhaczeniu, a nagłe pojawienie się „nowego" zadania wygląda jak błąd. */
    /* Przycisk dyktowania. W trakcie nasłuchu pulsuje — bez tego nie widać,
       czy apka już słucha, i mówi się w próżnię. */
    .btn-mikrofon { flex: none; padding: 0 12px; min-height: 46px; }
    .btn-mikrofon.slucha { border-color: var(--marka); color: var(--marka);
                           animation: mik-puls 1.1s ease-in-out infinite; }
    @keyframes mik-puls { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .btn-mikrofon.slucha { animation: none; } }

    .zad-cykl { margin-left: 7px; padding: 1px 7px; border-radius: 999px;
                background: var(--accent-soft); color: var(--accent-strong);
                font-size: 11px; font-weight: 600; white-space: nowrap; }
    /* Plakietka przedsięwzięcia. OBRYSOWANA, a nie wypełniona jak plakietka
       cyklu: dwie jednakowe pigułki przy tytule byłyby nie do rozróżnienia
       w locie, a niosą zupełnie różne rzeczy — „wróci po odhaczeniu" i „to
       jest przedsięwzięcie". */
    .zad-projekt { display: inline-block; margin-left: 7px; padding: 0 7px;
                   border-radius: 999px; border: 1px solid var(--marka);
                   color: var(--marka); font-size: 10px; font-weight: 700;
                   letter-spacing: .05em; text-transform: uppercase;
                   white-space: nowrap; vertical-align: 2px; }
    .powtarzanie { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .powtarzanie select { flex: 1; min-width: 150px; }
    .co-ile { display: flex; align-items: center; gap: 6px; font-size: 13px;
              color: var(--muted); white-space: nowrap; }
    .co-ile input { width: 62px; }
    .co-ile.schowane { display: none; }

    /* ── wykres Gantta ────────────────────────────────────────────────────
       Zwykły HTML, bez biblioteki: belka to div o szerokości liczonej z dni.
       Wykres pokazuje kilkanaście spraw domowych, nie harmonogram budowy —
       biblioteka ważyłaby więcej, niż daje.

       KOLUMNA NAZW JEST PRZYKLEJONA, oś jedzie pod nią w poziomie. Bez tego
       przewinięcie do listopada na telefonie zostawia same belki, o których
       nie wiadomo, czego dotyczą. */
    /* Kolumna nazw: na szerokim ekranie miejsca jest dość, żeby nie ucinać
       tytułów w połowie („Zebrać dokument…”, „Adaptacja projekt…”). */
    /* BEZ `overflow: hidden` — ono unieważnia przyklejanie nagłówka w środku,
       a bez przyklejenia przy przewijaniu długiego planu znika oś z miesiącami
       i nie wiadomo, na co się patrzy. Zawartość i tak przycina `.gantt-body`,
       który ma własne przewijanie w poziomie. */
    .gantt { --nazwa: 230px; border: 1px solid var(--border); border-radius: 12px;
             background: var(--surface); margin-bottom: 18px; }
    /* 56 px to wysokość górnego paska apki, który też jest przyklejony. */
    .gantt-gora { position: sticky; top: 56px; z-index: 6; background: var(--surface);
                  border-radius: 12px 12px 0 0; }
    /* Jeden rząd: przycisk widoku i suwak gęstości. Reszta ustawień siedzi
       w panelu rozwijanym — na telefonie trzy rzędy chipów zjadały pół ekranu,
       zanim w ogóle było widać wykres. */
    .plan-narzedzia { align-items: center; gap: 10px; margin-bottom: 8px; }
    .plan-narzedzia .skala { display: flex; align-items: center; gap: 8px;
                             font-size: 12px; color: var(--muted); flex: 1; min-width: 130px; }
    .plan-narzedzia .skala input { flex: 1; min-width: 80px; accent-color: var(--marka); }
    /* Panel mówi, CO ma być na wykresie. Wcześniej leżały w nim obok siebie,
       wyglądając identycznie, trzy różne rodzaje rzeczy: układ ekranu, filtr
       po statusie i zakres danych. Jednakowe pastylki obiecują, że robią to
       samo — więc każdy rodzaj dostał własny kształt: projekty to lista
       z ptaszkami, „zrobione" to przełącznik pod kreską, a szerokość kolumny
       wyszła stąd na samą kolumnę. */
    .panel-widoku { border: 1px solid var(--border); border-radius: 10px;
                    padding: 4px 10px 10px; margin-bottom: 10px;
                    background: var(--surface-2); }
    .pw-tytul { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
                color: var(--muted); margin: 8px 0 4px; }
    .pw-poz { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 40px;
              padding: 6px 4px; border: none; background: none; font: inherit;
              font-size: 13.5px; color: var(--text); cursor: pointer; text-align: left; }
    .pw-poz:hover { color: var(--marka); }
    .pw-ptaszek { flex: none; width: 18px; height: 18px; border: 1.5px solid var(--border);
                  border-radius: 5px; display: flex; align-items: center;
                  justify-content: center; color: #fff; }
    .pw-poz[aria-pressed="true"] .pw-ptaszek { border-color: transparent;
      background: color-mix(in srgb, var(--marka) 82%, #000); }
    .pw-ptaszek .ikona svg { width: 12px; height: 12px; stroke-width: 2.6; }
    .pw-nazwa { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
    /* Kreska oddziela pytanie o ZAKRES od pytania o STATUS — to dwie różne
       rzeczy i nie mają wyglądać jak jedna lista. */
    .pw-osobno { margin-top: 8px; padding-top: 8px;
                 border-top: 1px solid var(--border-soft); }
    .pw-przelacznik { display: flex; align-items: center; gap: 10px; min-height: 40px;
                      font-size: 13.5px; cursor: pointer; }
    .pw-przelacznik input { width: 18px; height: 18px; accent-color: var(--marka);
                            cursor: pointer; }

    /* Przycisk szerokości kolumny nazw stoi NAD tą kolumną, czyli nad tym, co
       zmienia. W panelu filtrów wyglądał jak filtr danych, którym nie jest. */
    /* Przycisk szerokości siedzi w PUSTYM rogu nad kolumną nazw — czyli nad
       tym, co zmienia. `bottom: 0`, bo jest równo z rzędem miesięcy; przy
       `top: 0` wchodziłby na pasek z danymi zaznaczonego zadania, gdy ten
       jest widoczny. */
    .gantt-szer { position: absolute; left: 0; bottom: 0; width: var(--nazwa); height: 26px;
                  z-index: 3; border: none; border-right: 1px solid var(--border);
                  border-bottom: 1px solid var(--border);
                  background: var(--surface); color: var(--muted); cursor: pointer;
                  font-size: 15px; line-height: 26px; text-align: right;
                  padding-right: 10px; }
    .gantt-szer:hover { color: var(--marka); }

    /* Kafelki akcji w pasku nad wykresem — te same co przy zadaniu na liście,
       żeby nie trzeba się było uczyć apki dwa razy. */
    .gi-akcje { display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
                margin-top: 8px; }
    .gi-akcje .zad-data, .gi-akcje .zad-kto,
    .gi-akcje .zad-plus { height: 30px; min-width: 32px; }
    .gi-akcje .gi-otworz { margin-left: auto; min-height: 34px; padding: 0 14px;
                           font-size: 12.5px; }

    /* NIE dopisuj tu `position` dla `.gantt-gora`. Nagłówek jest `sticky` z
       `top: 56px` (reguła wyżej) i nadpisanie tego na `relative` zamienia
       `top` w zwykłe przesunięcie — nagłówek zjeżdża o 56 px i przykrywa
       pierwsze wiersze wykresu. `sticky` i tak jest punktem odniesienia dla
       elementów pozycjonowanych bezwzględnie w środku, więc nic tu nie trzeba. */
    .gantt-osie { position: relative; height: 26px; margin-left: var(--nazwa);
                  border-bottom: 1px solid var(--border); overflow: hidden; }
    /* Warstwa przesuwana razem z wykresem — patrz `zsynchronizujOs`. */
    .gantt-osie-tresc { position: relative; height: 100%; will-change: transform; }
    .gantt-miesiac { position: absolute; top: 0; height: 26px; padding-left: 6px;
                     font-size: 11px; color: var(--muted); line-height: 26px;
                     border-left: 1px solid var(--border-soft); white-space: nowrap; }

    /* `cursor: grab` mówi wprost, że tło da się chwycić i przeciągnąć w bok —
       bez tego na komputerze nie było żadnej podpowiedzi, jak przewinąć oś. */
    .gantt-body { position: relative; overflow-x: auto; overflow-y: hidden;
                  -webkit-overflow-scrolling: touch; cursor: grab; }
    .gantt-body.przesuwany { cursor: grabbing; user-select: none; }
    /* `min-width: max-content` JEST WARUNKIEM DZIAŁANIA PRZYKLEJONEJ KOLUMNY.
       Element `sticky` klei się wyłącznie w obrębie swojego pudełka
       nadrzędnego. Bez tego wiersz miał szerokość ekranu (treść z niego
       wystawała), więc po przewinięciu osi o więcej niż szerokość telefonu
       pudełko wiersza wyjeżdżało z widoku i zabierało nazwę ze sobą — kolumna
       chowała się za lewą krawędzią. Zmierzone: przewinięcie o 483 px
       przesuwało nazwę z 21 px na −347 px. Teraz wiersz jest tak szeroki jak
       cały wykres, więc nazwa ma się gdzie kleić przez całą długość osi. */
    .gantt-wiersz { display: flex; align-items: center; min-height: 38px;
                    min-width: max-content;
                    border-bottom: 1px solid var(--border-soft); }
    .gantt-wiersz:last-child { border-bottom: none; }
    .gantt-nazwa { position: sticky; left: 0; z-index: 2; flex: none;
                   width: var(--nazwa); padding-right: 8px; font-size: 12.5px;
                   background: var(--surface);
                   display: flex; align-items: center; gap: 2px;
                   border-right: 1px solid var(--border); }
    .gantt-nazwa-tekst { flex: 1; min-width: 0; cursor: pointer;
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Daszek zwijania. Piętrowo: schowany etap chowa też wszystko pod sobą. */
    .gantt-zwin { flex: none; width: 18px; height: 30px; border: none; background: none;
                  color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer;
                  padding: 0; display: flex; align-items: center; justify-content: center;
                  transform: rotate(90deg); transition: transform .15s; }
    .gantt-zwin.zwiniety { transform: rotate(0deg); }
    .gantt-zwin:hover { color: var(--marka); }
    /* Puste miejsce przy zadaniach bez kroków — żeby nazwy nie skakały w lewo
       i w prawo zależnie od tego, czy dane zadanie coś w sobie ma. */
    .gantt-zwin.pusty { cursor: default; }
    @media (prefers-reduced-motion: reduce) { .gantt-zwin { transition: none; } }
    .gantt-projekt { display: inline-block; width: 7px; height: 7px; margin-right: 5px;
                     border-radius: 2px; background: var(--marka); vertical-align: middle; }
    .gantt-tor { position: relative; height: 38px; flex: none; }

    /* `overflow: visible`, NIE hidden: kropka łącznika wystaje poza belkę
       i przy `hidden` była po prostu ucinana. Podpis daty i tak pokazujemy
       tylko przy belkach dość szerokich, więc nie ma czego przycinać. */
    .gantt-belka { position: absolute; top: 9px; height: 20px; border-radius: 5px;
                   background: var(--accent); cursor: pointer; overflow: visible;
                   display: flex; align-items: center; justify-content: flex-end;
                   padding: 0 6px; min-width: 6px; }
    .gantt-belka span { font-size: 10.5px; color: #fff; opacity: .92; white-space: nowrap; }
    /* Belkę da się chwycić i przesunąć: środek przesuwa całość, krawędzie
       zmieniają początek albo termin. `touch-action: none` jest KONIECZNE —
       bez niego przeglądarka na telefonie potraktuje ruch palcem jako
       przewijanie i belka nie drgnie. */
    /* z-index podnosi belkę nad strzałki zależności — bez tego ich szerokie
       pole trafienia przechwytywało stuknięcia w wąskie zadania. */
    .gantt-belka { touch-action: none; cursor: grab; z-index: 1; }
    .gantt-belka.ciagniona { cursor: grabbing; opacity: .85;
                             box-shadow: 0 2px 10px rgba(0,0,0,.28); }
    /* Belka oparta o barierę wynikającą z zależności — dalej się nie da. */
    .gantt-belka.zablokowana { outline: 2px solid var(--danger); outline-offset: 1px; }
    /* Kropka do wyciągania zależności: pociągnij ją na inne zadanie. */
    /* WIDOCZNA ZAWSZE, nie pod najechaniem: na telefonie nie ma kursora, więc
       element pokazywany na :hover po prostu nie istnieje. Przygaszona, żeby
       kilkanaście kropek nie robiło z wykresu paciorków; pod kursorem i przy
       łączeniu rozjaśnia się do pełna. */
    .lacznik { position: absolute; right: -15px; top: 50%; width: 13px; height: 13px;
               margin-top: -6.5px; border-radius: 50%; background: var(--surface);
               border: 2px solid var(--accent-strong); cursor: crosshair;
               touch-action: none; opacity: .5; transition: opacity .12s, transform .12s; }
    .gantt-belka:hover .lacznik, .gantt.laczy .lacznik { opacity: 1; }
    .lacznik:hover { transform: scale(1.25); }
    /* Na dotyku uchwyt musi być większy niż sam kropkowany znacznik — palec
       ma około 40 px, a kropka 13. Powiększamy pole trafienia, nie rysunek. */
    .lacznik::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; }
    .gantt.laczy { cursor: crosshair; }
    .gantt-belka.cel-laczenia { outline: 3px solid var(--accent-strong); outline-offset: 2px; }

    .gantt-belka .uchwyt { position: absolute; top: 0; bottom: 0; width: 12px;
                           cursor: ew-resize; touch-action: none; }
    .gantt-belka .uchwyt.lewy { left: -3px; }
    .gantt-belka .uchwyt.prawy { right: -3px; }
    /* Uchwyt zaznacza się dopiero pod kursorem — stale widoczne kreski przy
       kilkunastu belkach robiłyby z wykresu drabinę. */
    .gantt-belka:hover .uchwyt::after { content: ''; position: absolute; top: 4px;
      bottom: 4px; width: 2px; background: rgba(255,255,255,.75); border-radius: 1px; }
    .gantt-belka:hover .uchwyt.lewy::after { left: 4px; }
    .gantt-belka:hover .uchwyt.prawy::after { right: 4px; }
    .gantt-belka.projekt { background: var(--marka); height: 24px; top: 7px; }
    .gantt-belka.zrobiona { background: var(--good); opacity: .55; }
    /* SPÓŹNIENIE ROZPOZNAJE SIĘ PO PASKACH, nie po samym kolorze. W module
       zadań `--accent` i `--danger` to praktycznie ten sam odcień czerwieni,
       więc belka spóźniona wyglądała identycznie jak zwykła. Ukośne paski
       działają niezależnie od motywu i od tego, jak blisko siebie są barwy. */
    .gantt-belka.po-czasie {
      background: var(--danger);
      background-image: repeating-linear-gradient(45deg,
        rgba(255,255,255,.28) 0 4px, transparent 4px 9px);
    }
    /* Kamień milowy to punkt, nie odcinek — romb zamiast paska.
       Nazwa z przedrostkiem, bo samo `.kamien` jest już zajęte przez znacznik
       przy tytule zadania na liście i nadpisywało belce kolor i szerokość. */
    .gantt-belka.gantt-kamien { width: 16px !important; height: 16px; top: 11px;
                                border-radius: 3px; transform: rotate(45deg); padding: 0; }
    .gantt-belka.gantt-kamien span { display: none; }

    /* Pasek z danymi zaznaczonego zadania. Na dotyku zastępuje dymek `title`,
       którego nie da się wywołać bez kursora — pierwsze stuknięcie w belkę
       wypisuje tu daty i powiązania, dopiero drugie otwiera formularz. */
    /* UKŁAD PIONOWY, nie poziomy. Daty stały obok nazwy i przy długim tytule
       zawijały się w dziwnych miejscach, rozpychając pasek na kilka linijek —
       najgorzej, gdy zadanie ma i początek, i termin. Nazwa dostaje własną
       linijkę, daty własną; pasek jest niższy i przewidywalnej wysokości. */
    .gantt-info { display: flex; flex-direction: column; align-items: stretch; gap: 3px;
                  border-bottom: 1px solid var(--marka);
                  background: var(--accent-soft); padding: 9px 12px;
                  border-radius: 12px 12px 0 0; }
    .gi-tytul { font-weight: 600; color: var(--heading); font-size: 14px;
                line-height: 1.3; overflow-wrap: anywhere; }
    .gi-dane { font-size: 12.5px; color: var(--accent-strong); }
    .gi-otworz { min-height: 36px; padding: 0 14px; flex: none; }
    /* Powiązania do zdjęcia — cel wielkości palca, w przeciwieństwie do samej
       kreski na wykresie. */
    .gi-po { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
             width: 100%; }
    .gi-po-etykieta { font-size: 11.5px; color: var(--muted); }
    .gi-zal { font-size: 11.5px; padding: 3px 8px; min-height: 30px; }
    .gi-zal button { border: none; background: none; cursor: pointer; color: inherit;
                     font: inherit; font-size: 14px; line-height: 1; padding: 2px 4px; }
    .gantt-belka.zaznaczona { outline: 2px solid var(--heading); outline-offset: 2px; }

    /* Weekendy — najlżejszy możliwy ślad. Mają dawać rytm tygodnia, a nie
       konkurować z belkami: gdy pas jest wyraźny, oko czyta go jako zdarzenie,
       a nie jako tło. */
    .gantt-weekend { position: absolute; top: 0; bottom: 0; z-index: 0;
                     background: var(--surface-3); opacity: .55; pointer-events: none; }

    /* Strzałki zależności — jedno SVG na całą siatkę, pod belkami.
       SVG przepuszcza kliknięcia (`pointer-events: none`), ale same strzałki
       już nie: inaczej nie dałoby się ich kliknąć, a przezroczyste tło
       zasłaniałoby belki pod spodem. */
    /* POD belkami (z-index 0), nie nad. Pole trafienia strzałki ma kilkanaście
       pikseli i przy wąskich belkach nachodziło na nie — stuknięcie w zadanie
       trafiało w linię i pytało o usunięcie powiązania zamiast pokazać zadanie.
       Belka zawsze wygrywa; strzałkę klika się tam, gdzie biegnie sama. */
    .gantt-zaleznosci { position: absolute; top: 0; pointer-events: none; z-index: 0; }
    .gantt-zaleznosci .zal-grupa { pointer-events: auto; cursor: pointer; }
    /* Szerokie, niewidoczne pole trafienia — sama kreska ma 2 px i palcem
       nie da się w nią wejść. */
    /* Węższe niż wcześniej (14 → 9): przy gęstym planie szerokie pole zbierało
       stuknięcia należące do sąsiednich belek. Trafienie w linię jest nadal
       wykonalne, bo linie biegną w wolnej przestrzeni między zadaniami. */
    .gantt-zaleznosci .zal-trafienie { fill: none; stroke: transparent; stroke-width: 9; }
    .gantt-zaleznosci .zal-grupa:hover .zal { opacity: 1; stroke-width: 2.6; }
    .gantt-zaleznosci .zal-grupa:hover .zal-grot { opacity: 1; }
    /* Wyraźniejsze niż domyślna szarość: na tle siatki i kilkunastu belek
       cienka przerywana linia po prostu ginęła. */
    .gantt-zaleznosci .zal { fill: none; stroke: var(--accent-strong); stroke-width: 1.8;
                             stroke-dasharray: 5 3; opacity: .75; }
    .gantt-zaleznosci .zal-grot { fill: var(--accent-strong); opacity: .75; }
    /* Powiązanie naruszone: następnik zaczyna się przed końcem poprzednika.
       To jedyny moment, w którym plan sam mówi, że się nie domyka. */
    .gantt-zaleznosci .naruszona { stroke: var(--danger); stroke-width: 2;
                                   stroke-dasharray: none; }
    .gantt-zaleznosci .naruszona-grot { fill: var(--danger); }
    .poprzedniki { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .poprzedniki .chip { gap: 4px; }
    .poprzedniki .chip button { border: none; background: none; cursor: pointer;
                                color: inherit; font: inherit; padding: 0 2px; }

    .gantt-dzis { position: absolute; top: 0; bottom: 0; width: 2px;
                  background: var(--marka); opacity: .55; pointer-events: none; z-index: 1; }
    /* Podpis kreski dostaje tło — bez niego napis „dziś" nakładał się na belkę
       pierwszego wiersza i obie rzeczy stawały się nieczytelne. */
    .gantt-dzis span { position: absolute; top: 0; left: 3px; font-size: 10px;
                       color: var(--marka); font-weight: 700; padding: 0 3px;
                       background: var(--surface); border-radius: 0 0 4px 0; }

    /* Kolumna nazw rozwinięta na chwilę — do przeczytania dłuższych tytułów.
       Nazwa przestaje być ucinana i zawija się do dwóch linii; wysokość wiersza
       zostaje bez zmian, bo od niej zależy pozycja belek i strzałek. */
    /* Połowa ekranu, nie tyle, ile ma najdłuższa nazwa. Reszta się zawija,
       kosztem wyższego wiersza — lepiej mieć jeden wiersz na trzy linijki niż
       kolumnę zjadającą cały ekran, na której nie widać już osi czasu. */
    .gantt.szerokie-nazwy { --nazwa: min(50vw, 300px); }
    /* Zawijanie dotyczy SAMEGO TEKSTU, nie całej komórki. Reguła siedziała
       kiedyś na `.gantt-nazwa`, ale ta komórka jest teraz pojemnikiem `flex`
       na daszek zwijania i tekst — `display: -webkit-box` kasował jej układ. */
    .gantt.szerokie-nazwy .gantt-nazwa-tekst {
      white-space: normal; overflow: visible; text-overflow: clip;
      overflow-wrap: anywhere; line-height: 1.3; font-size: 12px;
      padding: 5px 0;
    }
    /* Wiersz rośnie razem z tekstem. Strzałki zależności przestają wtedy
       pasować do stałej wysokości — dlatego `poprawStrzalki` przelicza je
       z faktycznych pozycji wierszy po wstawieniu wykresu. */
    .gantt.szerokie-nazwy .gantt-wiersz { align-items: stretch; }
    .gantt.szerokie-nazwy .gantt-nazwa { align-items: center; }

    @media (max-width: 700px) {
      /* Na telefonie nazwa dostaje mniej miejsca — inaczej na oś zostaje pasek
         szerokości kciuka i nie da się nic odczytać. Przycisk „Szersze nazwy"
         rozwija ją na chwilę, gdy trzeba coś doczytać. */
      .gantt { --nazwa: 104px; }
    }
    /* Panel przedsięwzięć. Kafelki zamiast listy, bo projekt ma trzy liczby
       naraz (postęp, termin, zaległości) i w wierszu listy nie mieszczą się
       tak, żeby dało się je porównać między projektami. */
    .projekty { display: grid; gap: 10px; margin-bottom: 16px;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .projekt-kafel { text-align: left; font: inherit; cursor: pointer;
                     border: 1px solid var(--border); border-radius: 12px;
                     background: var(--surface); padding: 12px 14px; color: var(--text); }
    .projekt-kafel:hover { border-color: var(--marka); }
    .pk-gora { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .pk-nazwa { font-weight: 600; color: var(--heading); flex: 1; min-width: 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pk-termin { font-size: 12px; color: var(--muted); flex: none; }
    .pk-pasek { height: 6px; border-radius: 3px; background: var(--surface-3);
                overflow: hidden; margin-bottom: 6px; }
    .pk-pasek i { display: block; height: 100%; background: var(--marka); }
    .pk-dol { display: flex; justify-content: space-between; gap: 8px;
              font-size: 12px; color: var(--muted); }
    .pk-spoznione { color: var(--danger); font-weight: 600; }

    /* DRZEWO Z LINIAMI. Same wcięcia nie wystarczały: po dwóch poziomach lista
       wyglądała płasko i nie było widać, co jest częścią czego. Pionowa linia
       przy grupie dzieci pokazuje przynależność bez liczenia pikseli. */
    .zad-galaz { position: relative; }
    .zad-dzieci { margin-left: 13px; padding-left: 13px;
                  border-left: 2px solid var(--border); }
    /* Gałąź bez dzieci nie rysuje linii donikąd — zostaje tylko miejsce na
       pole dopisywania, które w niej wyskakuje. */
    .zad-dzieci.pusta { border-left-color: transparent; padding-left: 13px; }
    .zad-dopisz { padding: 8px 0; display: flex; gap: 8px; }
    /* `display: flex` nadpisuje atrybut `hidden` (on ustawia tylko display:none
       z arkusza przeglądarki, który przegrywa ze zwykłą regułą) — bez tego pole
       dopisywania stało otwarte przy KAŻDYM zadaniu naraz. */
    .zad-dopisz[hidden] { display: none; }
    .zad-dopisz input { flex: 1; min-width: 0; min-height: 40px; }
    .btn-dopisz { flex: none; min-height: 40px; padding: 0 14px; }

    /* SZYBKIE POLA przy zadaniu. Natywny `input[type=date]` i `select` leżą
       przezroczyste NA etykiecie: stuknięcie otwiera systemowy wybór daty albo
       listę osób, bez pisania własnego okienka i bez wchodzenia w formularz. */
    .zad-data, .zad-kto { position: relative; flex: none; display: inline-flex;
                          align-items: center; justify-content: center;
                          min-width: 34px; height: 30px; padding: 0 7px;
                          border: 1px solid var(--border); border-radius: 8px;
                          font-size: 11.5px; color: var(--muted); cursor: pointer;
                          white-space: nowrap; }
    /* Ustawiona data jest ZWYCZAJNA, nie wyróżniona kolorem modułu: koralowa
       ramka przy każdym terminie czytała się jak ostrzeżenie, przez co
       naprawdę spóźnione zadania przestawały się wyróżniać. */
    .zad-data.jest, .zad-kto.jest { border-color: var(--border); color: var(--text);
                                    font-weight: 600; }
    .zad-data.po-czasie { border-color: var(--danger); color: var(--danger); font-weight: 600; }
    .zad-data input, .zad-kto select { position: absolute; inset: 0; opacity: 0;
                                       width: 100%; height: 100%; cursor: pointer;
                                       border: none; padding: 0; }
    .zad-data .ikona svg, .zad-kto .ikona svg { width: 16px; height: 16px; }
    /* Obszar wyróżniony kolorem modułu, gdy ustawiony — inaczej sześć jednakowo
       szarych kafelków w rzędzie nic nie mówi na pierwszy rzut oka. */
    .zad-obszar.jest { color: var(--marka); border-color: var(--marka); }

    .zad { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); }
    /* Przycisk „+” — dopisuje krok bez opuszczania listy. Widoczny zawsze,
       bo ukryty pod najechaniem nie istnieje dla palca na telefonie. */
    .zad-plus { flex: none; width: 30px; height: 30px; border-radius: 8px;
                border: 1px solid var(--border); background: var(--surface);
                color: var(--muted); font-size: 19px; line-height: 1;
                cursor: pointer; font-family: inherit; }
    .zad-plus:hover { border-color: var(--marka); color: var(--marka); }
    /* Przycisk dziennika. Gdy są już wpisy, pokazuje ICH LICZBĘ zamiast ikony —
       inaczej trzeba by otworzyć każde zadanie po kolei, żeby sprawdzić, przy
       którym coś zapisano. */
    .zad-komentarz { display: flex; align-items: center; justify-content: center;
                     font-size: 12px; font-weight: 600; }
    .zad-komentarz .ikona svg { width: 15px; height: 15px; }
    .zad-komentarz.jest { border-color: var(--marka); color: var(--marka); }

    /* DZIENNIK — wpisy z datami, pionowa oś po lewej jak na osi czasu. */
    .zad-dziennik { padding: 4px 0 10px; }
    .zad-dziennik[hidden] { display: none; }
    .dz-laduje, .dz-pusto { color: var(--muted); font-size: 12.5px; padding: 4px 0; }
    .dz-lista { list-style: none; margin: 0 0 8px; padding: 0 0 0 14px;
                border-left: 2px solid var(--border); }
    .dz-lista li { position: relative; padding: 0 0 10px; }
    .dz-lista li::before { content: ''; position: absolute; left: -19px; top: 5px;
                           width: 7px; height: 7px; border-radius: 50%;
                           background: var(--marka); }
    .dz-meta { display: flex; align-items: center; gap: 6px; font-size: 11px;
               color: var(--muted); }
    .dz-usun { margin-left: auto; border: none; background: none; cursor: pointer;
               color: var(--muted); font-size: 13px; line-height: 1; padding: 2px 4px; }
    .dz-usun:hover { color: var(--danger); }
    .dz-tresc { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
    .dz-nowy { display: flex; gap: 8px; }
    .dz-nowy input { flex: 1; min-width: 0; min-height: 40px; }
    /* Pole szybkiego dodawania w trybie „jestem w środku zadania” — ramka
       w kolorze modułu, żeby różnica była widoczna, a nie tylko napisana. */
    .szybkie.w-srodku input { border-color: var(--marka); }
    .zad.zrobione .zad-tytul { text-decoration: line-through; color: var(--muted); }
    /* Kwadrat, nie kółko: okrągłe pole czytało się jak przełącznik trybu, a to
       jest odhaczanie. Mniejsze niż wcześniej (20 zamiast 26) — na telefonie
       zjadało szerokość, której brakowało tytułowi. */
    .ptaszek { flex: none; width: 20px; height: 20px; border-radius: 5px;
               border: 1.5px solid var(--border); background: none; cursor: pointer;
               color: var(--marka); line-height: 1; display: flex; align-items: center;
               justify-content: center; padding: 0; }
    /* Samo pole jest małe, ale palec dostaje pełne 44 px przez niewidoczną
       otoczkę — zmniejszanie celu dotyku razem z grafiką to najprostszy sposób
       na to, żeby odhaczanie zaczęło chybiać. */
    .ptaszek::before { content: ''; position: absolute; width: 44px; height: 44px;
                       left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .ptaszek { position: relative; }
    /* Odhaczone = wypełniony kwadrat. Kolor przyciemniony względem --marka:
       biały ptaszek na czystym koralu daje kontrast 2,8:1, czyli poniżej progu
       3:1 dla elementów graficznych. Przyciemnienie o 18% podnosi go do ~4,7:1. */
    .zad.zrobione .ptaszek { border-color: transparent; color: #fff;
                             background: color-mix(in srgb, var(--marka) 82%, #000); }
    .ptaszek .ikona { display: flex; align-items: center; justify-content: center; }
    .ptaszek .ikona svg { width: 13px; height: 13px; stroke-width: 2.6; }
    .zad-tresc { flex: 1; min-width: 0; }
    .zad-tytul { font-size: 14.5px; color: var(--text); }
    .zad-nast { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .zad-termin { font-size: 12px; color: var(--muted); flex: none; }
    .zad-termin.po-czasie { color: var(--danger); font-weight: 600; }
    /* Licznik postępu jest przyciskiem zwijania — wygląda jak etykieta, bo nią
       jest, ale daszek i pole dotyku robią z niego coś klikalnego. */
    .zad-postep { display: inline-flex; align-items: center; gap: 3px; flex: none;
                  border: none; background: none; font: inherit; font-size: 12px;
                  color: var(--muted); cursor: pointer; padding: 6px 2px; }
    .zad-postep:hover { color: var(--marka); }
    .zad-daszek { display: inline-block; font-size: 15px; line-height: 1;
                  transform: rotate(90deg); transition: transform .15s; }
    .zad-postep.zwiniety .zad-daszek { transform: rotate(0deg); }
    .zad-podkroki[hidden] { display: none; }

    /* Kafelki akcji POD nazwą, nie obok. Obok siebie walczyły z tytułem
       o szerokość: pięć kafelków zabierało ~170 px, tytuł łamał się na trzy
       linijki i wiersz i tak wychodził wysoki — tylko brzydziej. Wcięcie
       równa się szerokość ptaszka plus odstęp, więc kafelki stoją w jednej
       linii z tytułem. */
    .zad-glowna { display: flex; align-items: center; gap: 10px; }
    /* ZAWIJANIE JEST BEZPIECZNIKIEM, nie układem docelowym. Siedem kafelków
       mieści się w jednym rzędzie dopiero od ~340 px; bez `wrap` na węższym
       ekranie ostatni z nich (trzy kropki) wychodziłby poza kartę zamiast
       zejść do drugiego rzędu. */
    .zad-akcje { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0 0 30px; }
    /* Jeden rozmiar dla wszystkich kafelków — inaczej rząd rozjeżdża się na
       tym, że każdy przycisk przyszedł tu z własną szerokością. */
    .zad-akcje > * { flex: none; height: 28px; min-width: 32px; margin: 0; }
    .zad-akcje .zad-data { padding: 0 6px; font-size: 11px; }
    /* Przeniesienie zadania — ikona, nie znak. „→" obok „+" czytałoby się jak
       para strzałek nawigacji, a to jest akcja na zadaniu. */
    .zad-przenies { display: flex; align-items: center; justify-content: center; }
    .zad-przenies .ikona svg { width: 16px; height: 16px; }
    /* Szczegóły na końcu rzędu, z dala od reszty: to jedyny kafelek, który
       otwiera osobne okno, a nie zmienia czegoś na miejscu. */
    .zad-akcje .zad-kropki { margin-left: auto; }
    .kamien { display: inline-block; width: 9px; height: 9px; margin-right: 6px;
              background: var(--marka); transform: rotate(45deg); }
    .pusto { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 12px; }

    /* ── wejście w zadanie: karta bieżącego zadania z powrotem ── */
    /* Powrót SIEDZI W KARCIE zadania, nie w osobnym pasku nad nią. Oddzielna
       listwa z okruszkami pojawiała się znikąd przy wejściu w projekt i nie
       było widać, do czego należy. Strzałka przyklejona z lewej do nazwy
       miejsca, w którym się jest, nie wymaga tłumaczenia. */
    .korzen-wroc { flex: none; width: 34px; height: 44px; margin-left: -6px;
                   border: none; background: none; color: var(--muted);
                   font-size: 24px; line-height: 1; cursor: pointer;
                   display: flex; align-items: center; justify-content: center; }
    .korzen-wroc:hover { color: var(--marka); }

    .zad-korzen { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                  border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
                  padding: 12px 14px; margin-bottom: 14px; }
    .zad-korzen > div { min-width: 0; flex: 1; }
    .zad-korzen-tytul { font-size: 15px; font-weight: 600; color: var(--heading);
                         overflow-wrap: break-word; }
    .zad-korzen-postep { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .zad-korzen .btn { flex: none; min-height: 44px; }

    /* Trzy kropki otwierają szczegóły. Pole dotyku 44 px, choć sama ikona ma
       18 — palec nie trafia w ikonę, tylko w obszar wokół niej. */
    .zad-kropki { flex: none; border: none; background: none; color: var(--muted);
                  cursor: pointer; display: flex; align-items: center;
                  justify-content: center; }
    .zad-kropki:hover { color: var(--marka); }
    .zad-kropki .ikona svg { width: 18px; height: 18px; }

    /* ── formularz szczegółów (przeniesione wiernie z health.html) ── */
    .pole { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
    .pole label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
                  color: var(--muted); font-weight: 700; }
    .pole input, .pole select, .pole textarea {
      border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px;
      font: inherit; font-size: 14px; background: var(--surface); color: var(--text);
      min-height: 44px; width: 100%; }
    .pole textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
    .pola-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    .pole-cb { margin-bottom: 11px; }
    .pole-cb label { display: flex; align-items: center; gap: 10px; font-size: 14px;
                      color: var(--text); min-height: 44px; cursor: pointer; }
    .pole-cb label.wylaczone { color: var(--muted); cursor: default; }
    .pole-cb input[type="checkbox"] { width: 20px; height: 20px; flex: none;
                                       accent-color: var(--marka); }
    .pole-cb input[type="checkbox"]:disabled { cursor: not-allowed; }

    .uwaga { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: -4px; }

    /* Przyciski biorą wygląd z systemu (.btn + .btn-primary/-outline/-danger)
       — tutaj tylko rozciągamy je na szerokość, bo na telefonie mają być
       łatwe do trafienia kciukiem. */
    .akcje { display: flex; gap: 9px; margin-top: 4px; }
    .akcje .btn { flex: 1; min-height: 46px; justify-content: center; font-size: 14.5px; }

    .wroc { background: none; border: none; color: var(--muted); font: inherit; font-size: 13.5px;
            cursor: pointer; padding: 6px 0; margin-bottom: 8px; }
    .wroc:hover { color: var(--accent); }

    /* ── ŁAPANIE ZADANIA ────────────────────────────────────────────────────
       Cały ten ekran istnieje dla jednej sytuacji: stoisz gdzieś, coś Ci się
       przypomina i masz wolny jeden kciuk. Dlatego każdy krok to JEDNO pytanie
       i najwyżej dwa duże kafelki, nigdy formularz. Ścieżka na górze pokazuje,
       gdzie zadanie wyląduje, i jednocześnie służy do cofania — dzięki temu
       nigdzie nie trzeba czytać, żeby wiedzieć, gdzie się jest. */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
               clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── OBSZARY ŻYCIA: pasek zakładek ──────────────────────────────────────
       Przełącznikiem był wcześniej sam TYTUŁ STRONY — oszczędzał 46 px, ale
       trzeba było WIEDZIEĆ, że tytuł jest klikalny, i nie było widać, jakie
       obszary w ogóle istnieją. Zakładki mówią to same: wszystkie naraz,
       bieżąca podświetlona. Bilans wysokości wychodzi na zero, bo pasek
       zastąpił tytuł, a nie doszedł do niego.

       Przyklejony pod górnym paskiem: przy przewiniętej liście „w którym
       obszarze jestem" jest pytaniem zadawanym najczęściej. */
    .obszary { position: sticky; top: 0; z-index: 60; background: var(--surface-2);
               border-bottom: 1px solid var(--border); }
    .obszary-in { display: flex; gap: 3px; align-items: flex-end; overflow-x: auto;
                  scrollbar-width: none; max-width: 1100px; margin: 0 auto;
                  padding: 6px 20px 0; }
    .obszary-in::-webkit-scrollbar { display: none; }
    /* Pasek stoi PRZED <main>, więc odbiera mu górny odstęp — inaczej między
       zakładkami a pierwszym wierszem robi się dziura na 28 px. */
    .obszary:not([hidden]) + main { padding-top: 14px; }
    /* Zakładka okienkowa: zaokrąglona u góry, przy dole zlana z treścią. */
    .ob { flex: none; display: inline-flex; align-items: center; gap: 6px;
          border: 1px solid transparent; border-bottom: none;
          border-radius: 9px 9px 0 0; padding: 8px 12px; margin-bottom: -1px;
          background: none; color: var(--muted); font: inherit; font-size: 12.5px;
          cursor: pointer; min-height: 38px; white-space: nowrap; }
    .ob:hover { color: var(--text); }
    /* Aktywna „wystaje" na krawędź paska — to ta jedna kreska robi z rzędu
       przycisków zakładki. */
    .ob.teraz { background: var(--surface); border-color: var(--border);
                border-bottom: 1px solid var(--surface); color: var(--marka);
                font-weight: 600; }
    .ob .ikona svg { width: 17px; height: 17px; }
    .ob i { font-style: normal; font-size: 10.5px; color: var(--muted);
            background: var(--surface); border-radius: 999px; padding: 1px 6px; }
    .ob.teraz i { background: var(--accent-soft); color: var(--accent-strong); }
    .ob-ustaw { margin-left: auto; padding: 8px 10px; }

    /* Na planie i w projektach nazwa widoku schodzi do roli podpisu —
       obszar mówi już pasek wyżej. */
    .plan-podpis { font-size: 12.5px; color: var(--muted); }

    .lap-poz.wybrana { border-color: var(--marka); }
    .lap-poz.wybrana .ile { color: var(--marka); font-weight: 600; }

    .strefa-wiersz { display: flex; align-items: center; gap: 9px; }
    .strefa-uzywam { flex: none; display: flex; align-items: center; }
    .strefa-uzywam input { width: 20px; height: 20px; accent-color: var(--marka);
                           cursor: pointer; }
    .strefa-tytul .ikona svg { width: 21px; height: 21px; }
    .strefa-znak { flex: none; display: flex; color: var(--marka); }
    .strefa-znak .ikona svg { width: 18px; height: 18px; }

    .strefa-nazwa { flex: 1; min-width: 0; min-height: 42px; font-size: 14px; }
    .strefa-ikona { flex: none; width: 38px; height: 38px; display: flex;
                    align-items: center; justify-content: center; cursor: pointer;
                    border: 1px solid var(--border); border-radius: 9px;
                    background: var(--surface); color: var(--marka); }
    .strefa-ikona:hover { border-color: var(--marka); }
    .strefa-ikona .ikona svg { width: 18px; height: 18px; }

    /* Paleta rozwija się POD wierszem strefy, zamiast otwierać kolejne okno
       nad oknem — arkusz jest już warstwą modalną i druga byłaby o jedną
       za dużo. */
    .strefa-paleta { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
                     padding: 8px 0 4px 47px; }
    .strefa-paleta[hidden] { display: none; }
    .strefa-wybor { display: flex; align-items: center; justify-content: center;
                    min-height: 40px; border: 1px solid var(--border); border-radius: 9px;
                    background: var(--surface); color: var(--muted); cursor: pointer; }
    .strefa-wybor:hover { border-color: var(--marka); color: var(--marka); }
    .strefa-wybor.teraz { border-color: var(--marka); color: var(--marka);
                          background: var(--surface-2); }
    .strefa-wybor .ikona svg { width: 18px; height: 18px; }
    .strefa-kasuj { flex: none; width: 34px; height: 34px; border: none; background: none;
                    color: var(--muted); font-size: 14px; cursor: pointer;
                    border-radius: 8px; }
    .strefa-kasuj:hover { background: var(--surface-2); color: var(--danger); }
    .fab-lap { position: fixed; right: 18px; bottom: 22px; z-index: 90;
               width: 60px; height: 60px; display: flex; align-items: center;
               justify-content: center; border: none; border-radius: 50%;
               background: var(--marka); color: #fff; box-shadow: var(--shadow-lg);
               cursor: pointer; }
    .fab-lap svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.2;
                   stroke-linecap: round; fill: none; }
    .fab-lap:active { transform: scale(.94); }
    /* Guzik ZNIKA, gdy ktoś pisze. Przy otwartej klawiaturze zasłaniał
       „Zapisz" w dzienniku, a łapanie nowego zadania w trakcie wpisywania
       innego i tak nie ma sensu. Klasę zdejmuje i nakłada `pilnujKlawiatury`. */
    .fab-lap.schowany { opacity: 0; pointer-events: none; transform: scale(.8); }
    .fab-lap { transition: opacity .15s, transform .15s; }
    @media (max-width: 700px) {
      .fab-lap { bottom: calc(78px + env(safe-area-inset-bottom)); right: 14px; }
    }
    /* Miejsce POD listą na wysokość guzika: bez niego ostatni wiersz zostawał
       pod nim na stałe i nie dało się dosięgnąć jego trzech kropek. */
    main { padding-bottom: 84px; }
    @media (prefers-reduced-motion: reduce) { .fab-lap { transition: none; } }

    /* Warstwa NAD dolnym paskiem nawigacji (`z-index: 200`), ale POD oknem
       potwierdzenia (`.pyt-tlo`, 10060) — pytanie zadane z wnętrza arkusza musi
       się wyświetlić na nim, a nie za nim. */
    .lap-tlo { position: fixed; inset: 0; z-index: 10000; background: rgba(20,18,16,.45);
               display: flex; align-items: flex-end; justify-content: center; }
    .lap-tlo[hidden] { display: none; }
    .lap-arkusz { width: 100%; max-width: 460px; background: var(--surface);
                  border-radius: 20px 20px 0 0; padding: 8px 18px 20px;
                  padding-bottom: calc(20px + env(safe-area-inset-bottom));
                  box-shadow: 0 -8px 40px rgba(0,0,0,.22);
                  animation: lap-wjazd .22s ease-out; }
    @keyframes lap-wjazd { from { transform: translateY(14px); opacity: 0; } }
    /* Na szerokim ekranie arkusz przyklejony do dołu wygląda jak przypadek —
       tam to zwykłe okno na środku. */
    @media (min-width: 701px) {
      .lap-tlo { align-items: center; }
      .lap-arkusz { border-radius: 18px; padding-bottom: 20px; }
    }

    .lap-uchwyt { width: 38px; height: 4px; border-radius: 2px; background: var(--border);
                  margin: 0 auto 10px; }
    @media (min-width: 701px) { .lap-uchwyt { display: none; } }

    .lap-gora { display: flex; align-items: center; gap: 8px; min-height: 32px;
                margin-bottom: 14px; }
    .lap-wroc, .lap-zamknij { flex: none; width: 32px; height: 32px; border: none;
                              background: none; color: var(--muted); cursor: pointer;
                              font-size: 19px; line-height: 1; border-radius: 8px; }
    .lap-wroc[hidden] { visibility: hidden; display: block; }  /* miejsce zostaje */
    .lap-wroc:hover, .lap-zamknij:hover { background: var(--surface-2); color: var(--text); }
    .lap-zamknij { margin-left: auto; }

    /* Ścieżka: gdzie zadanie wyląduje. Ostatni człon jest bieżący, wcześniejsze
       są klikalne i cofają do swojego poziomu. */
    .lap-sciezka { display: flex; align-items: center; gap: 4px; min-width: 0;
                   overflow-x: auto; scrollbar-width: none; font-size: 12px; }
    .lap-sciezka::-webkit-scrollbar { display: none; }
    .lap-sciezka button { flex: none; border: none; background: none; font: inherit;
                          color: var(--muted); cursor: pointer; padding: 4px 2px;
                          white-space: nowrap; }
    .lap-sciezka button:hover { color: var(--marka); }
    .lap-sciezka .teraz { color: var(--marka); font-weight: 600; }
    .lap-sciezka .strzal { color: var(--border); flex: none; }

    .lap-pyt { margin: 0 0 12px; font-size: 15px; color: var(--text); font-weight: 600; }
    .lap-pod { margin: -6px 0 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    /* Kafelki decyzji — po dwa w rzędzie, wysokie na tyle, żeby trafić w nie
       bez patrzenia. */
    .lap-kafle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lap-kafel { display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 8px; min-height: 96px; padding: 14px 10px;
                 border: 1.5px solid var(--border); border-radius: 14px;
                 background: var(--surface); color: var(--text); font: inherit;
                 font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
    .lap-kafel:hover { border-color: var(--marka); color: var(--marka); }
    .lap-kafel .ikona svg { width: 24px; height: 24px; }
    .lap-kafel small { font-weight: 400; font-size: 11.5px; color: var(--muted);
                       line-height: 1.4; }
    .lap-kafel:hover small { color: inherit; }
    .lap-kafel.pelny { grid-column: 1 / -1; min-height: 60px; flex-direction: row; }
    .lap-kafel.mocny { border-color: var(--marka); background: var(--marka); color: #fff; }
    .lap-kafel.mocny small { color: rgba(255,255,255,.8); }

    /* Lista wyboru projektu albo kroku — jeden rząd na pozycję, cała szerokość,
       bo nazwy bywają długie i skracanie ich do kafelka odbiera pewność, że
       trafiło się w to, o co chodziło. */
    .lap-lista { display: flex; flex-direction: column; gap: 8px;
                 max-height: min(46vh, 340px); overflow-y: auto; margin: 0 -4px;
                 padding: 0 4px; }
    .lap-poz { display: flex; align-items: center; gap: 10px; width: 100%;
               min-height: 52px; padding: 10px 14px; border: 1.5px solid var(--border);
               border-radius: 12px; background: var(--surface); color: var(--text);
               font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
    .lap-poz:hover { border-color: var(--marka); }
    .lap-poz .nazwa { flex: 1; min-width: 0; }
    .lap-poz .ile { flex: none; font-size: 11.5px; color: var(--muted); }
    .lap-poz .ikona svg { width: 18px; height: 18px; }
    /* Projekt na liście miejsc jest grubszy — przedsięwzięcia stoją na górze
       i mają się odcinać od zwykłych zadań bez dopisywania słowa „projekt". */
    .lap-poz.projekt .nazwa { font-weight: 600; }
    .lap-poz.zle:hover { border-color: var(--danger); color: var(--danger); }

    /* Zbieranie luźnych zadań do projektu: ta sama pozycja co przy wyborze
       miejsca, tylko z ptaszkiem. Kwadracik jest w ETYKIECIE, więc celem dotyku
       jest cały wiersz — trafianie w 20 px na telefonie kończy się chybieniem. */
    .przen-poz { cursor: pointer; }
    .przen-poz input { flex: none; width: 20px; height: 20px; margin: 0;
                       accent-color: var(--marka); }
    .przen-poz.wybrana { border-color: var(--marka); background: var(--accent-soft); }
    /* Pole nazwy nowego projektu — ten sam wygląd co pole dyktowania obok. */
    .lap-pisz input { width: 100%; font: inherit; font-size: 15px; padding: 11px 12px;
                      border-radius: 12px; border: 1.5px solid var(--border);
                      background: var(--surface); color: var(--text); }
    .lap-pisz input:focus { outline: none; border-color: var(--marka); }
    .lap-kafel[disabled] { opacity: .45; cursor: default; }

    /* Rozpoznane zdanie. To najważniejsza rzecz na ekranie — jest cytatem tego,
       co przed chwilą powiedziałeś, więc dostaje rozmiar i cudzysłów, a nie
       etykietę „Tytuł:". */
    .lap-cytat { margin: 0 0 10px; font-size: 19px; line-height: 1.3; color: var(--text);
                 font-weight: 600; }
    .lap-cytat::before { content: '„'; color: var(--marka); }
    .lap-cytat::after { content: '"'; color: var(--marka); }
    .lap-chipy { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .lap-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px;
                border-radius: 999px; background: var(--surface-2); color: var(--muted);
                font-size: 11.5px; }
    .lap-chip .ikona svg { width: 13px; height: 13px; }
    /* Obszar usłyszany w zdaniu — jedyna plakietka mówiąca o zmianie względem
       tego, co widać na ekranie, więc jedyna wyróżniona kolorem. */
    .lap-chip-obszar { background: var(--accent-soft); color: var(--accent-strong);
                       font-weight: 600; }

    /* Nasłuch. Pierścień pulsuje tylko po to, żeby było widać, że mikrofon
       naprawdę słucha — bez tego cisza wygląda identycznie jak zawieszenie. */
    .lap-mikrofon { display: flex; flex-direction: column; align-items: center; gap: 14px;
                    padding: 18px 0 8px; }
    .lap-krag { position: relative; width: 84px; height: 84px; border-radius: 50%;
                border: none; background: var(--marka); color: #fff; cursor: pointer;
                display: flex; align-items: center; justify-content: center; }
    .lap-krag .ikona svg { width: 34px; height: 34px; stroke-width: 1.7; }
    .lap-krag::after { content: ''; position: absolute; inset: -10px; border-radius: 50%;
                       border: 2px solid var(--marka); opacity: .5;
                       animation: lap-puls 1.4s ease-out infinite; }
    @keyframes lap-puls { to { transform: scale(1.35); opacity: 0; } }
    .lap-stan { font-size: 14px; color: var(--text); font-weight: 600; }
    .lap-mikrofon .lap-pod { margin: 0; text-align: center; }

    .lap-czeka { display: flex; flex-direction: column; align-items: center; gap: 12px;
                 padding: 30px 0; color: var(--muted); font-size: 14px; }
    .lap-kropki { display: flex; gap: 6px; }
    .lap-kropki i { width: 8px; height: 8px; border-radius: 50%; background: var(--marka);
                    animation: lap-skok 1s ease-in-out infinite; }
    .lap-kropki i:nth-child(2) { animation-delay: .16s; }
    .lap-kropki i:nth-child(3) { animation-delay: .32s; }
    @keyframes lap-skok { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .lap-pisz { display: flex; flex-direction: column; gap: 10px; }
    .lap-pisz textarea { width: 100%; min-height: 84px; resize: none; font: inherit;
                         font-size: 15px; padding: 11px 12px; border-radius: 12px;
                         border: 1.5px solid var(--border); background: var(--surface);
                         color: var(--text); }
    .lap-pisz textarea:focus { outline: none; border-color: var(--marka); }

    /* Wyjście awaryjne pod kafelkami: „to nie to miejsce". Celowo blade i małe —
       ma być dostępne, ale nie konkurować z główną decyzją. */
    .lap-inne { display: block; width: 100%; margin-top: 12px; border: none;
                background: none; font: inherit; font-size: 12.5px; color: var(--muted);
                cursor: pointer; padding: 8px; }
    .lap-inne:hover { color: var(--marka); }

    @media (prefers-reduced-motion: reduce) {
      .lap-arkusz, .lap-krag::after, .lap-kropki i { animation: none; }
    }

    @media (max-width: 560px) { .pola-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">w<span class="lg-i">ı<i class="lg-kropka"></i></span>em<i class="lg-kropka"></i></a>
</nav>

<!-- Zakładki obszarów życia. Poza <main>, bo mają dotykać górnego paska
     i przyklejać się do niego przy przewijaniu; treść w środku wyrównana
     do tej samej szerokości co reszta strony. -->
<div class="obszary" id="obszary" hidden><div class="obszary-in" id="obszary-in"></div></div>

<main>
  <div id="tresc"></div>
</main>

<!-- Łapanie zadania: pływający guzik zawsze w zasięgu kciuka, niezależnie od
     tego, jak daleko przewinięta jest lista. -->
<button type="button" id="fab-lap" class="fab-lap"
        aria-label="Złap zadanie" title="Złap zadanie">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
</button>

<div class="lap-tlo" id="lap-tlo" hidden>
  <div class="lap-arkusz" role="dialog" aria-modal="true" aria-labelledby="lap-tytul-a11y">
    <div class="lap-uchwyt"></div>
    <header class="lap-gora">
      <button type="button" class="lap-wroc" id="lap-wroc" aria-label="Wróć" hidden>‹</button>
      <div class="lap-sciezka" id="lap-sciezka"></div>
      <button type="button" class="lap-zamknij" id="lap-zamknij" aria-label="Zamknij">✕</button>
    </header>
    <h2 id="lap-tytul-a11y" class="sr-only">Łapanie zadania</h2>
    <div id="lap-krok"></div>
  </div>
</div>

<div class="lap-tlo" id="strefy-tlo" hidden>
  <div class="lap-arkusz" role="dialog" aria-modal="true" aria-labelledby="strefy-a11y">
    <div class="lap-uchwyt"></div>
    <header class="lap-gora">
      <h2 id="strefy-a11y" class="sr-only">Obszary życia</h2>
      <button type="button" class="lap-zamknij" id="strefy-zamknij" aria-label="Zamknij">✕</button>
    </header>
    <div id="strefy-krok"></div>
  </div>
</div>

<!-- Przenoszenie gotowego zadania pod projekt albo pod inne zadanie. Osobny
     arkusz od łapania, bo tamten prowadzi WŁASNY stan przepływu (nagranie,
     rozpoznanie, zapis) — wpychanie w niego drugiej ścieżki znaczyłoby, że
     każde „gdzie" musi wiedzieć, którą z dwóch spraw właśnie obsługuje. -->
<div class="lap-tlo" id="przen-tlo" hidden>
  <div class="lap-arkusz" role="dialog" aria-modal="true" aria-labelledby="przen-a11y">
    <div class="lap-uchwyt"></div>
    <header class="lap-gora">
      <button type="button" class="lap-wroc" id="przen-wroc" aria-label="Wróć" hidden>‹</button>
      <div class="lap-sciezka" id="przen-sciezka"></div>
      <button type="button" class="lap-zamknij" id="przen-zamknij" aria-label="Zamknij">✕</button>
    </header>
    <h2 id="przen-a11y" class="sr-only">Przenoszenie zadania</h2>
    <div id="przen-krok"></div>
  </div>
</div>

<script defer src="/static/dyktowanie.js"></script>
<script defer src="/static/task.js"></script>
</body>
</html>
