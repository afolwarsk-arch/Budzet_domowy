<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Zadania — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <style>
    .gora { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .gora h1 { margin: 0; font-size: 1.25rem; }

    .filtry { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
            padding: 7px 12px; min-height: 38px; font: inherit; font-size: 12.5px;
            cursor: pointer; color: var(--text); display: inline-flex; align-items: center;
            gap: 6px; }
    .chip[aria-pressed="true"] { border-color: var(--marka); background: var(--surface-2);
            font-weight: 600; }

    .szybkie { display: flex; gap: 8px; margin-bottom: 16px; }
    .szybkie input { flex: 1; min-height: 46px; }

    /* Znacznik zadania powtarzalnego — bez niego nie widać, że sprawa wróci
       po odhaczeniu, a nagłe pojawienie się „nowego" zadania wygląda jak błąd. */
    .zad-cykl { margin-left: 7px; padding: 1px 7px; border-radius: 999px;
                background: var(--accent-soft); color: var(--accent-strong);
                font-size: 11px; font-weight: 600; white-space: nowrap; }
    .powtarzanie { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .powtarzanie select { flex: 1; min-width: 150px; }
    .co-ile { display: flex; align-items: center; gap: 6px; font-size: 13px;
              color: var(--muted); white-space: nowrap; }
    .co-ile input { width: 62px; }
    .co-ile.schowane { display: none; }

    /* ── wykres Gantta ────────────────────────────────────────────────────
       Zwykły HTML, bez biblioteki: belka to div o szerokości liczonej z dni.
       Wykres pokazuje kilkanaście spraw domowych, nie harmonogram budowy —
       biblioteka ważyłaby więcej, niż daje.

       KOLUMNA NAZW JEST PRZYKLEJONA, oś jedzie pod nią w poziomie. Bez tego
       przewinięcie do listopada na telefonie zostawia same belki, o których
       nie wiadomo, czego dotyczą. */
    .gantt { --nazwa: 148px; border: 1px solid var(--border); border-radius: 12px;
             overflow: hidden; background: var(--surface); margin-bottom: 18px; }
    .plan-narzedzia { align-items: center; gap: 12px; }
    .plan-narzedzia .skala { display: flex; align-items: center; gap: 8px;
                             font-size: 12px; color: var(--muted); }
    .plan-narzedzia .skala input { flex: 1; min-width: 110px; accent-color: var(--marka); }

    .gantt-osie { position: relative; height: 26px; margin-left: var(--nazwa);
                  border-bottom: 1px solid var(--border); overflow: hidden; }
    .gantt-miesiac { position: absolute; top: 0; height: 26px; padding-left: 6px;
                     font-size: 11px; color: var(--muted); line-height: 26px;
                     border-left: 1px solid var(--border-soft); white-space: nowrap; }

    .gantt-body { position: relative; overflow-x: auto; overflow-y: hidden;
                  -webkit-overflow-scrolling: touch; }
    .gantt-wiersz { display: flex; align-items: center; min-height: 38px;
                    border-bottom: 1px solid var(--border-soft); }
    .gantt-wiersz:last-child { border-bottom: none; }
    .gantt-nazwa { position: sticky; left: 0; z-index: 2; flex: none;
                   width: var(--nazwa); padding-right: 8px; font-size: 12.5px;
                   background: var(--surface); cursor: pointer;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                   border-right: 1px solid var(--border); }
    .gantt-projekt { display: inline-block; width: 7px; height: 7px; margin-right: 5px;
                     border-radius: 2px; background: var(--marka); vertical-align: middle; }
    .gantt-tor { position: relative; height: 38px; flex: none; }

    .gantt-belka { position: absolute; top: 9px; height: 20px; border-radius: 5px;
                   background: var(--accent); cursor: pointer; overflow: hidden;
                   display: flex; align-items: center; justify-content: flex-end;
                   padding: 0 6px; min-width: 6px; }
    .gantt-belka span { font-size: 10.5px; color: #fff; opacity: .92; white-space: nowrap; }
    .gantt-belka.projekt { background: var(--marka); height: 24px; top: 7px; }
    .gantt-belka.zrobiona { background: var(--good); opacity: .55; }
    /* SPÓŹNIENIE ROZPOZNAJE SIĘ PO PASKACH, nie po samym kolorze. W module
       zadań `--accent` i `--danger` to praktycznie ten sam odcień czerwieni,
       więc belka spóźniona wyglądała identycznie jak zwykła. Ukośne paski
       działają niezależnie od motywu i od tego, jak blisko siebie są barwy. */
    .gantt-belka.po-czasie {
      background: var(--danger);
      background-image: repeating-linear-gradient(45deg,
        rgba(255,255,255,.28) 0 4px, transparent 4px 9px);
    }
    /* Kamień milowy to punkt, nie odcinek — romb zamiast paska.
       Nazwa z przedrostkiem, bo samo `.kamien` jest już zajęte przez znacznik
       przy tytule zadania na liście i nadpisywało belce kolor i szerokość. */
    .gantt-belka.gantt-kamien { width: 16px !important; height: 16px; top: 11px;
                                border-radius: 3px; transform: rotate(45deg); padding: 0; }
    .gantt-belka.gantt-kamien span { display: none; }

    .gantt-dzis { position: absolute; top: 0; bottom: 0; width: 2px;
                  background: var(--marka); opacity: .55; pointer-events: none; z-index: 1; }
    /* Podpis kreski dostaje tło — bez niego napis „dziś" nakładał się na belkę
       pierwszego wiersza i obie rzeczy stawały się nieczytelne. */
    .gantt-dzis span { position: absolute; top: 0; left: 3px; font-size: 10px;
                       color: var(--marka); font-weight: 700; padding: 0 3px;
                       background: var(--surface); border-radius: 0 0 4px 0; }

    @media (max-width: 700px) {
      /* Na telefonie nazwa dostaje mniej miejsca — inaczej na oś zostaje pasek
         szerokości kciuka i nie da się nic odczytać. */
      .gantt { --nazwa: 104px; }
    }
    .zad { display: flex; align-items: center; gap: 10px; padding: 12px;
           border-bottom: 1px solid var(--border-soft); }
    .zad.zrobione .zad-tytul { text-decoration: line-through; color: var(--muted); }
    .ptaszek { flex: none; width: 26px; height: 26px; border-radius: 50%;
               border: 1.5px solid var(--border); background: none; cursor: pointer;
               color: var(--marka); line-height: 1; display: flex; align-items: center;
               justify-content: center; }
    .ptaszek .ikona { display: flex; align-items: center; justify-content: center; }
    .ptaszek .ikona svg { width: 16px; height: 16px; stroke-width: 2; }
    .zad-tresc { flex: 1; min-width: 0; }
    .zad-tytul { font-size: 14.5px; color: var(--text); }
    .zad-nast { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .zad-termin { font-size: 12px; color: var(--muted); flex: none; }
    .zad-termin.po-czasie { color: var(--danger); font-weight: 600; }
    .zad-postep { font-size: 12px; color: var(--muted); flex: none; }
    .kamien { display: inline-block; width: 9px; height: 9px; margin-right: 6px;
              background: var(--marka); transform: rotate(45deg); }
    .pusto { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 12px; }

    /* ── wejście w zadanie: okruszki, karta bieżącego zadania, strzałka ── */
    .okruszki { display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
                margin-bottom: 12px; font-size: 12.5px; }
    .okruszki button { background: none; border: none; font: inherit; font-size: 12.5px;
                        color: var(--muted); cursor: pointer; padding: 10px 3px; min-height: 44px; }
    .okruszki button:hover { color: var(--marka); }
    .okruszki button:last-child { color: var(--heading); font-weight: 600; pointer-events: none; }
    .okruszki span { color: var(--border); padding: 0 1px; }

    .zad-korzen { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                  border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
                  padding: 12px 14px; margin-bottom: 14px; }
    .zad-korzen > div:first-child { min-width: 0; flex: 1; }
    .zad-korzen-tytul { font-size: 15px; font-weight: 600; color: var(--heading);
                         overflow-wrap: break-word; }
    .zad-korzen-postep { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .zad-korzen .btn { flex: none; min-height: 44px; }

    .zad-strzalka { flex: none; width: 44px; height: 44px; margin-right: -10px; border: none;
                    background: none; color: var(--muted); font-size: 20px; line-height: 1;
                    cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .zad-strzalka:hover { color: var(--marka); }

    /* Przycisk „Szczegóły" przy zadaniu dodanym przed chwilą przez szybkie
       dodawanie — jedyna droga do formularza bez wchodzenia strzałką. */
    .zad-szczegoly-btn { display: inline-flex; align-items: center; margin-top: 6px;
                          border: 1px solid var(--border); background: var(--surface);
                          color: var(--marka); border-radius: 8px; padding: 6px 12px;
                          font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
                          min-height: 44px; }
    .zad-szczegoly-btn:hover { border-color: var(--marka); }

    /* ── formularz szczegółów (przeniesione wiernie z health.html) ── */
    .pole { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
    .pole label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
                  color: var(--muted); font-weight: 700; }
    .pole input, .pole select, .pole textarea {
      border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px;
      font: inherit; font-size: 14px; background: var(--surface); color: var(--text);
      min-height: 44px; width: 100%; }
    .pole textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
    .pola-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    .pole-cb { margin-bottom: 11px; }
    .pole-cb label { display: flex; align-items: center; gap: 10px; font-size: 14px;
                      color: var(--text); min-height: 44px; cursor: pointer; }
    .pole-cb label.wylaczone { color: var(--muted); cursor: default; }
    .pole-cb input[type="checkbox"] { width: 20px; height: 20px; flex: none;
                                       accent-color: var(--marka); }
    .pole-cb input[type="checkbox"]:disabled { cursor: not-allowed; }

    .uwaga { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: -4px; }

    /* Przyciski biorą wygląd z systemu (.btn + .btn-primary/-outline/-danger)
       — tutaj tylko rozciągamy je na szerokość, bo na telefonie mają być
       łatwe do trafienia kciukiem. */
    .akcje { display: flex; gap: 9px; margin-top: 4px; }
    .akcje .btn { flex: 1; min-height: 46px; justify-content: center; font-size: 14.5px; }

    .wroc { background: none; border: none; color: var(--muted); font: inherit; font-size: 13.5px;
            cursor: pointer; padding: 6px 0; margin-bottom: 8px; }
    .wroc:hover { color: var(--accent); }

    @media (max-width: 560px) { .pola-2 { grid-template-columns: 1fr; } }
  </style>
</head>
