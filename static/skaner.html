<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Sprawdź produkt — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <script defer src="/static/eat-skaner.js"></script>
  <style>
    main { padding-bottom: 96px; }
    .gora { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .gora h1 { margin: 0; font-size: 1.25rem; }
    .podtytul { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.45; }

    .cta-skan { width: 100%; background: var(--primary); color: var(--on-primary); border: none;
                border-radius: 12px; padding: 15px; font: inherit; font-size: 15px; font-weight: 600;
                cursor: pointer; min-height: 52px; margin-bottom: 10px; }
    .reczny { display: flex; gap: 8px; margin-bottom: 16px; }
    .reczny input { flex: 1; }
    .reczny button { border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
                     padding: 0 16px; font: inherit; font-size: 13px; cursor: pointer;
                     color: var(--text); min-height: 44px; }

    #podglad { display: none; margin-bottom: 14px; }
    #podglad video { width: 100%; border-radius: 12px; background: #000; }

    /* ── wynik ── */
    .prod { border: 1px solid var(--border); border-radius: 14px; padding: 16px;
            background: var(--surface); }
    .prod-marka { font-size: 12px; color: var(--muted); text-transform: uppercase;
                  letter-spacing: .05em; }
    .prod h2 { margin: 2px 0 4px; font-size: 1.05rem; line-height: 1.3; }
    .prod-kod { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Nutri-Score jako litera w kolorze skali — tak wygląda na opakowaniach. */
    .oceny { display: flex; gap: 10px; align-items: stretch; margin: 16px 0 6px; flex-wrap: wrap; }
    .ocena { flex: 1; min-width: 96px; border: 1px solid var(--border); border-radius: 11px;
             padding: 11px 10px; text-align: center; }
    .ocena .duza { display: block; font-size: 27px; font-weight: 800; line-height: 1.1; }
    .ocena .maly { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px;
                   line-height: 1.3; }

    .sek-tyt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
               color: var(--muted); margin: 20px 0 9px; }
    .odz { display: flex; align-items: center; gap: 10px; padding: 7px 0;
           border-bottom: 1px solid var(--border-soft); }
    .odz:last-child { border-bottom: none; }
    .odz-pas { width: 74px; height: 7px; border-radius: 4px; background: var(--border);
               flex: none; overflow: hidden; }
    .odz-pas i { display: block; height: 100%; border-radius: 4px; }
    .odz-n { flex: 1; font-size: 13.5px; }
    .odz-w { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
             white-space: nowrap; }
    .odz-p { font-size: 10.5px; color: var(--muted); white-space: nowrap; width: 52px;
             text-align: right; }

    .stopka { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 18px;
              border-top: 1px solid var(--border-soft); padding-top: 12px; }
    .komunikat { font-size: 13px; color: var(--muted); margin: 12px 0; line-height: 1.5; }
    .komunikat.blad { color: var(--danger); }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">w<span class="lg-i">ı<i class="lg-kropka"></i></span>em<i class="lg-kropka"></i></a>
</nav>

<main>
  <div class="gora"><h1>Sprawdź produkt</h1></div>
  <div class="podtytul">Zeskanuj kod kreskowy, żeby zobaczyć ocenę — bez dodawania niczego
    do dziennika.</div>

  <button class="cta-skan" id="skanuj" type="button">Skanuj kod kreskowy</button>
  <div id="podglad">
    <video id="video" playsinline muted></video>
    <div class="komunikat">Skieruj aparat na kod kreskowy.</div>
  </div>
  <div class="reczny">
    <input type="text" id="kod" inputmode="numeric" placeholder="albo wpisz cyfry spod kreskówki">
    <button id="szukaj" type="button">Sprawdź</button>
  </div>

  <div id="komunikat"></div>
  <div id="wynik"></div>
</main>

<script defer src="/static/skaner.js"></script>
</body>
</html>
