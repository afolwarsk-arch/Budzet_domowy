<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Statystyki — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <style>
    main { padding-bottom: 96px; }
    .gora { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .gora h1 { margin: 0; font-size: 1.25rem; }

    /* Przełącznik okresu — ten sam wzorzec co wybór posiłku w dzienniku. */
    .okres { display: flex; gap: 8px; margin-bottom: 14px; }
    .okres button { flex: 1; border: 1px solid var(--border); background: var(--surface);
                    border-radius: 10px; padding: 10px 6px; min-height: 44px; font: inherit;
                    font-size: 13px; cursor: pointer; color: var(--text); }
    .okres button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary);
                    border-color: var(--primary); font-weight: 600; }

    .stat-kafle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-kafel { border: 1px solid var(--border); border-radius: 12px; padding: 13px 8px;
                  background: var(--surface); text-align: center; }
    .stat-kafel b { display: block; font-size: 22px; color: var(--heading);
                    font-variant-numeric: tabular-nums; }
    .stat-kafel span { font-size: 11px; color: var(--muted); line-height: 1.3; display: block;
                       margin-top: 3px; }

    /* Słupki rysujemy elementami, nie biblioteką — przy 7 albo 30 wartościach
       wykres to po prostu kilka div-ów o różnej wysokości. */
    .stat-slupki { display: flex; align-items: flex-end; gap: 3px; height: 90px; margin-bottom: 5px; }
    .stat-slupek { flex: 1; background: var(--good); border-radius: 3px 3px 0 0; min-height: 2px;
                   opacity: .8; }
    .stat-slupek.pusty { background: var(--border); opacity: 1; }
    .stat-slupek.ponad { background: var(--danger); }
    .stat-osie { display: flex; justify-content: space-between; font-size: 11px;
                 color: var(--muted); margin-bottom: 20px; }

    .sek-tyt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
               color: var(--muted); margin: 18px 0 8px; }
    .stat-ocena { display: flex; gap: 3px; margin-bottom: 7px; }
    .stat-ocena i { height: 12px; border-radius: 3px; font-style: normal; }
    .stat-legenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
    .stat-legenda em { font-style: normal; display: inline-flex; align-items: center; gap: 5px; }
    .stat-legenda em s { width: 10px; height: 10px; border-radius: 2px; text-decoration: none; }

    .stat-stopka { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 20px;
                   border-top: 1px solid var(--border-soft); padding-top: 14px; }
    .laduje { text-align: center; color: var(--muted); padding: 30px; font-size: 15px; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">w<span class="lg-i">ı<i class="lg-kropka"></i></span>em<i class="lg-kropka"></i></a>
</nav>

<main>
  <div class="gora"><h1>Statystyki i oceny</h1></div>

  <div class="okres" id="okres">
    <button data-dni="7" aria-pressed="true" type="button">Tydzień</button>
    <button data-dni="30" aria-pressed="false" type="button">Miesiąc</button>
  </div>

  <div id="tresc"><div class="laduje">Wczytuję…</div></div>
</main>

<script defer src="/static/statystyki.js"></script>
</body>
</html>
