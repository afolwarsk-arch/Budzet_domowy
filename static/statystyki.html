<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Statystyki — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <style>
    main { padding-bottom: 96px; }
    .gora { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .gora h1 { margin: 0; font-size: 1.25rem; }

    /* Przełącznik okresu — ten sam wzorzec co wybór posiłku w dzienniku. */
    .okres { display: flex; gap: 8px; margin-bottom: 14px; }
    .okres button { flex: 1; border: 1px solid var(--border); background: var(--surface);
                    border-radius: 10px; padding: 10px 6px; min-height: 44px; font: inherit;
                    font-size: 13px; cursor: pointer; color: var(--text); }
    .okres button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary);
                    border-color: var(--primary); font-weight: 600; }

    .stat-kafle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-kafel { border: 1px solid var(--border); border-radius: 12px; padding: 13px 8px;
                  background: var(--surface); text-align: center; }
    .stat-kafel b { display: block; font-size: 22px; color: var(--heading);
                    font-variant-numeric: tabular-nums; }
    .stat-kafel span { font-size: 11px; color: var(--muted); line-height: 1.3; display: block;
                       margin-top: 3px; }

    /* Słupki rysujemy elementami, nie biblioteką — przy 7 albo 30 wartościach
       wykres to po prostu kilka div-ów o różnej wysokości. */
    /* Słupek skumulowany: białko / tłuszcz / węglowodany, każde przeliczone na
       kalorie. Układ pionowy od dołu, bo tak czyta się wykres słupkowy. */
    .stat-slupki { display: flex; align-items: flex-end; gap: 3px; height: 120px;
                   margin-bottom: 5px; position: relative; }
    .stat-slupek { flex: 1; display: flex; flex-direction: column-reverse; min-height: 2px;
                   border-radius: 3px 3px 0 0; overflow: hidden; background: var(--border); }
    .stat-slupek i { display: block; width: 100%; }
    .cz-b { background: #4f7a52; }        /* białko */
    .cz-t { background: #d9a441; }        /* tłuszcz */
    .cz-w { background: #7b6fb0; }        /* węglowodany */
    .cz-nieznane { background: var(--border); }
    /* Nadwyżka ponad LIMIT (tłuszcz, węgle) — czerwona, bo to przekroczenie.
       Nadwyżka ponad MINIMUM (białko) zostaje w kolorze makra, tylko jaśniejsza:
       zjedzenie więcej białka niż w celu nie jest błędem. */
    .cz-ponad { background: var(--danger); }
    /* Domowe jedzenie i surowce — nie mają oceny, bo ta skala ich nie obejmuje.
       Kreskowanie, a nie kolor: to nie jest ocena, tylko brak zastosowania. */
    .cz-domowe { background: var(--surface-2);
      background-image: repeating-linear-gradient(45deg, transparent 0 3px,
                        rgba(79,122,82,.45) 3px 6px); }
    .nadwyzka { opacity: .5; }

    .widoki { margin-top: -6px; }
    .widoki button { font-size: 12.5px; padding: 8px 4px; min-height: 40px; }
    .stat-slupek.pusty { background: var(--border); }
    /* Dzień oznaczony jako niekompletny: widoczny, ale wyraźnie „nie liczy się". */
    .stat-slupek.niepelny { opacity: .35;
      background-image: repeating-linear-gradient(45deg, transparent 0 3px,
                        rgba(128,128,128,.5) 3px 6px); }
    .stat-cel { position: absolute; left: 0; right: 0; height: 0;
                border-top: 1px dashed var(--muted); opacity: .7; pointer-events: none; }
    /* Słupek jest przyciskiem — zdejmujemy domyślny wygląd, zostawiamy wskaźnik
       ogniskowania, bo po wykresie da się chodzić klawiaturą. */
    button.stat-slupek { border: none; padding: 0; cursor: pointer; font: inherit; }
    button.stat-slupek:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .stat-slupek.wybrany { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ── szczegóły wybranego dnia ── */
    .dzien-karta { border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px;
                   background: var(--surface); margin: 4px 0 16px; }
    .dk-gl { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
             margin-bottom: 8px; }
    .dk-gl b { font-size: 14px; }
    .dk-gl span { font-size: 15px; font-weight: 700; color: var(--heading);
                  font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dk-makro { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px;
                color: var(--muted); }
    .dk-makro em { font-style: normal; display: flex; align-items: center; gap: 7px; }
    .dk-makro s { width: 10px; height: 10px; border-radius: 2px; text-decoration: none; flex: none; }
    .dk-uwaga { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-top: 7px; }
    .dk-przel { display: flex; align-items: flex-start; gap: 9px; margin-top: 11px;
                padding-top: 10px; border-top: 1px solid var(--border-soft); cursor: pointer;
                font-size: 12.5px; line-height: 1.4; }
    .dk-przel input { width: 19px; height: 19px; flex: none; margin-top: 1px; cursor: pointer; }
    .stat-osie { display: flex; justify-content: space-between; font-size: 11px;
                 color: var(--muted); margin-bottom: 20px; }

    .sek-tyt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
               color: var(--muted); margin: 18px 0 8px; }
    .stat-ocena { display: flex; gap: 3px; margin-bottom: 7px; }
    .stat-ocena i { height: 12px; border-radius: 3px; font-style: normal; }
    .stat-legenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
    .stat-legenda em { font-style: normal; display: inline-flex; align-items: center; gap: 5px; }
    .stat-legenda em s { width: 10px; height: 10px; border-radius: 2px; text-decoration: none;
                         flex: none; }
    .stat-legenda em s.cz-niepelny { background: var(--border);
      background-image: repeating-linear-gradient(45deg, transparent 0 2px,
                        rgba(128,128,128,.6) 2px 4px); }

    .stat-stopka { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 20px;
                   border-top: 1px solid var(--border-soft); padding-top: 14px; }
    .laduje { text-align: center; color: var(--muted); padding: 30px; font-size: 15px; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">w<span class="lg-i">ı<i class="lg-kropka"></i></span>em<i class="lg-kropka"></i></a>
</nav>

<main>
  <div class="gora"><h1>Statystyki i oceny</h1></div>

  <div class="okres" id="okres">
    <button data-dni="7" aria-pressed="true" type="button">Tydzień</button>
    <button data-dni="30" aria-pressed="false" type="button">Miesiąc</button>
  </div>

  <div class="okres widoki" id="widok">
    <button data-widok="wszystko" aria-pressed="true" type="button">Wszystko</button>
    <button data-widok="bialko" aria-pressed="false" type="button">Białko</button>
    <button data-widok="tluszcz" aria-pressed="false" type="button">Tłuszcz</button>
    <button data-widok="wegle" aria-pressed="false" type="button">Węgle</button>
  </div>

  <div id="tresc"><div class="laduje">Wczytuję…</div></div>
</main>

<script defer src="/static/statystyki.js"></script>
</body>
</html>
