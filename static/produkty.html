<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Produkty — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <script defer src="/static/eat-skaner.js"></script>
  <style>
    main { padding-bottom: 96px; }
    .gora { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .gora h1 { margin: 0; font-size: 1.25rem; }
    .gora .ile { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
    .podtytul { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }

    .cta-dodaj { width: 100%; background: var(--primary); color: var(--on-primary); border: none;
                 border-radius: 12px; padding: 15px; font: inherit; font-size: 15px; font-weight: 600;
                 cursor: pointer; min-height: 52px; margin-bottom: 12px; }

    .szukaj { display: flex; gap: 8px; margin-bottom: 10px; }
    .szukaj input { flex: 1; min-width: 0; }

    /* Filtry jako chipy — te same co w zadaniach, żeby nie uczyć się apki
       dwa razy. „Własne" to produkty, których nie było w żadnej bazie:
       odczytane z etykiety albo wpisane ręcznie. */
    .filtry { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted);
            border-radius: 999px; padding: 6px 13px; font: inherit; font-size: 12.5px;
            cursor: pointer; min-height: 34px; }
    .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* ── lista bazy ── */
    .poz { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
           background: var(--surface); border: 1px solid var(--border-soft); border-radius: 11px;
           margin-bottom: 6px; font: inherit; text-align: left; color: var(--text); cursor: pointer; }
    .poz:hover { border-color: var(--accent); }
    .poz .nz { flex: 1; min-width: 0; }
    .poz .nz b { display: block; font-size: 13.5px; font-weight: 500; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
    .poz .nz span { font-size: 11.5px; color: var(--muted); }
    .poz .kc { flex: none; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .poz .serce { flex: none; color: var(--danger); font-size: 13px; }
    /* Znacznik źródła. Produkt z etykiety albo z ręki to WASZ wpis — nikt go
       nie sprawdzi za Was — a produkt z Open Food Facts przyszedł z zewnątrz.
       Przy poprawianiu wartości ta różnica jest pierwszą rzeczą, którą trzeba
       wiedzieć. */
    .zn { flex: none; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
          border-radius: 999px; padding: 2px 7px; border: 1px solid var(--border);
          color: var(--muted); white-space: nowrap; }
    .zn.wlasny { border-color: var(--accent); color: var(--accent); }

    .pusto { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 12px;
             line-height: 1.5; }

    /* ── arkusz ── */
    .ark-tlo { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9998;
               display: flex; align-items: flex-end; justify-content: center; }
    .ark { background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
           border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    @media (min-width: 560px) { .ark-tlo { align-items: center; } .ark { border-radius: 18px; } }
    .ark-gl { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .ark-gl h2 { margin: 0; font-size: 1.05rem; }
    .ark-gl .x { background: none; border: none; color: var(--muted); font-size: 23px;
                 cursor: pointer; line-height: 1; padding: 0 4px; }
    .ark-gl .x.koniec { margin-left: auto; }

    .drogi { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 6px; }
    .droga { border: 1px solid var(--border); border-radius: 12px; padding: 12px 11px;
             background: var(--surface-2); cursor: pointer; text-align: left; font: inherit;
             color: var(--text); }
    .droga.glowna { grid-column: span 2; background: var(--primary); border-color: var(--primary);
                    color: var(--on-primary); display: flex; align-items: center; gap: 12px; padding: 14px; }
    .droga svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7;
                 stroke-linecap: round; stroke-linejoin: round; }
    .droga .t { font-size: 13.5px; font-weight: 600; display: block; margin-top: 6px; }
    .droga.glowna .t { margin-top: 0; font-size: 15px; }
    .droga .o { font-size: 11.5px; color: var(--muted); display: block; margin-top: 2px; line-height: 1.35; }
    .droga.glowna .o { color: rgba(251,249,244,.72); }

    .szybka { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--surface-2);
              border: 1px solid var(--border-soft); border-radius: 11px; margin-bottom: 6px; cursor: pointer;
              width: 100%; font: inherit; text-align: left; color: var(--text); }
    .szybka .nz { flex: 1; min-width: 0; overflow: hidden; }
    .szybka .nz b { font-size: 13.5px; font-weight: 500; display: block; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
    .szybka .nz span { font-size: 11.5px; color: var(--muted); }

    .sek-tyt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
               font-weight: 700; margin: 16px 0 8px; }
    .komunikat { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 8px 0; }
    .komunikat.blad { color: var(--danger); }

    #podglad { display: none; margin-bottom: 12px; }
    #podglad video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3;
                     object-fit: cover; }

    .cta { width: 100%; padding: 13px; border: none; border-radius: 11px; background: var(--primary);
           color: var(--on-primary); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
           min-height: 50px; }
    .cta[disabled] { opacity: .55; cursor: not-allowed; }
    .cta.druga { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .cta-usun { width: 100%; margin-top: 8px; padding: 11px; background: none; border: none;
                color: var(--danger); font: inherit; font-size: 13px; cursor: pointer; border-radius: 10px; }
    .cta-usun:hover { background: var(--danger-bg); }
    label.droga, label.cta { cursor: pointer; display: block; text-align: center; }
    label.droga { text-align: left; }
    label.droga:focus-visible, label.cta:focus-visible { outline: 2px solid var(--accent);
                                                         outline-offset: 2px; }
    /* „schowane", a NIE display:none. Pole z display:none bywa traktowane jak
       nieistniejące i odmawia otwarcia aparatu — bez błędu, po prostu nic się
       nie dzieje. */
    .schowane { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* ── karta produktu (przeniesiona ze „Sprawdź produkt") ── */
    .prod-gora { text-align: center; padding: 2px 0 10px; }
    .prod-gora .marka { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
                        color: var(--muted); font-weight: 700; }
    .prod-gora h3 { margin: 4px 0 2px; font-size: 18px; color: var(--heading); }
    .prod-gora .op { font-size: 12.5px; color: var(--muted); }

    /* Nutri-Score jako litera w kolorze skali — tak wygląda na opakowaniach. */
    .oceny { display: flex; gap: 9px; align-items: stretch; margin: 14px 0 4px; flex-wrap: wrap; }
    .ocena { flex: 1; min-width: 92px; border: 1px solid var(--border); border-radius: 11px;
             padding: 10px 9px; text-align: center; }
    .ocena .duza { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; }
    .ocena .maly { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px;
                   line-height: 1.3; }
    .odz { display: flex; align-items: center; gap: 10px; padding: 7px 0;
           border-bottom: 1px solid var(--border-soft); }
    .odz:last-child { border-bottom: none; }
    .odz-pas { width: 74px; height: 7px; border-radius: 4px; background: var(--border);
               flex: none; overflow: hidden; }
    .odz-pas i { display: block; height: 100%; border-radius: 4px; }
    .odz-n { flex: 1; font-size: 13.5px; }
    .odz-w { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
             white-space: nowrap; }
    .odz-p { font-size: 10.5px; color: var(--muted); white-space: nowrap; width: 52px;
             text-align: right; }
    .stopka { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 16px;
              border-top: 1px solid var(--border-soft); padding-top: 11px; }

    /* ── formularz ręczny ── */
    .pola { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
    .pola .cale { grid-column: span 2; }
    .pole { display: flex; flex-direction: column; gap: 3px; }
    .pole label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
                  color: var(--muted); font-weight: 700; }
    .pole input { width: 100%; }
    .na100 { font-size: 11.5px; color: var(--muted); margin: -4px 0 8px; }
  </style>
</head>
<body>
<nav>
  <a href="/eat" class="logo">w<span class="lg-i">ı<i class="lg-kropka"></i></span>em<i class="lg-kropka"></i></a>
</nav>

<main>
  <div class="gora"><h1>Produkty</h1><span class="ile" id="ile"></span></div>
  <div class="podtytul">Baza produktów całego gospodarstwa. Dołóż tu wszystko, czego
    nie zna kod kreskowy — raz wpisany produkt jest potem w dzienniku pod ręką.</div>

  <button class="cta-dodaj" id="dodaj" type="button">+ Dodaj produkt</button>

  <div class="szukaj">
    <input type="text" id="fraza" placeholder="Szukaj w bazie…" autocomplete="off"
           aria-label="Szukaj w bazie produktów">
  </div>
  <div class="filtry" id="filtry">
    <button class="chip" type="button" data-f="wszystkie" aria-pressed="true">Wszystkie</button>
    <button class="chip" type="button" data-f="wlasne" aria-pressed="false">Własne</button>
    <button class="chip" type="button" data-f="ulubione" aria-pressed="false">Ulubione</button>
  </div>

  <div id="lista"><div class="komunikat">Wczytuję…</div></div>
</main>

<script defer src="/static/produkty.js"></script>
</body>
</html>
