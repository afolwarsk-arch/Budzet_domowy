<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Budżet domowy</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .household-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); padding: 20px; }
    .household-card h3 { font-size: 1rem; margin-bottom: 4px; color: #1a1a1a; }
    .household-card .created { font-size: 0.75rem; color: #aaa; margin-bottom: 14px; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid #f4f4f4; font-size: 0.85rem; }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: #666; }
    .stat-value { font-weight: 500; color: #1a1a1a; }
    .stat-value.cost { color: #4361ee; }
    .stat-value.dim { color: #999; font-weight: 400; font-size: 0.8rem; }
    .members-list { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0f0f0; }
    .member-item { display: flex; flex-direction: column; padding: 4px 0; font-size: 0.82rem; }
    .member-name { font-weight: 500; color: #333; }
    .member-email { color: #888; }
    .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:0.72rem; }
    .badge-green { background:#e8f5e9; color:#388e3c; }
    .badge-gray { background:#f5f5f5; color:#888; }
  </style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="/static/auth.js"></script>
<nav>
  <a href="/" class="logo">🏠 Budżet</a>
  <a href="/">Dashboard</a>
  <span style="margin-left:auto;font-size:0.85rem;color:#888">Panel admina</span>
</nav>

<main style="max-width:1100px">
  <h1>Panel admina</h1>
  <div id="stats-container">Ładowanie...</div>
</main>

<script>
function fmt(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleString('pl', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtDate(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleDateString('pl', { day:'2-digit', month:'2-digit', year:'numeric' });
}

authRequireHousehold().then(async (me) => {
  if (me.email !== 'a.folwarsk@gmail.com') {
    document.querySelector('main').innerHTML = '<p style="color:#d32f2f">Brak dostępu.</p>';
    return;
  }

  try {
    const stats = await authFetch('/api/admin/stats').then(r => r.json());
    if (!stats.length) {
      document.getElementById('stats-container').innerHTML = '<p style="color:#aaa">Brak gospodarstw.</p>';
      return;
    }

    const totalCost = stats.reduce((s, r) => s + parseFloat(r.cost_usd || 0), 0);
    const totalWydatki = stats.reduce((s, r) => s + parseInt(r.wydatki_count || 0), 0);
    const totalCalls = stats.reduce((s, r) => s + parseInt(r.api_calls || 0), 0);

    let html = `
      <div style="display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap">
        <div class="card" style="flex:1;min-width:160px;text-align:center">
          <div style="font-size:1.6rem;font-weight:700;color:#4361ee">${stats.length}</div>
          <div style="font-size:0.8rem;color:#888">Gospodarstw</div>
        </div>
        <div class="card" style="flex:1;min-width:160px;text-align:center">
          <div style="font-size:1.6rem;font-weight:700;color:#4361ee">${totalWydatki}</div>
          <div style="font-size:0.8rem;color:#888">Wydatków łącznie</div>
        </div>
        <div class="card" style="flex:1;min-width:160px;text-align:center">
          <div style="font-size:1.6rem;font-weight:700;color:#4361ee">${totalCalls}</div>
          <div style="font-size:0.8rem;color:#888">Zapytań AI</div>
        </div>
        <div class="card" style="flex:1;min-width:160px;text-align:center">
          <div style="font-size:1.6rem;font-weight:700;color:#4361ee">$${totalCost.toFixed(4)}</div>
          <div style="font-size:0.8rem;color:#888">Koszt API łącznie</div>
        </div>
      </div>
      <div class="stats-grid">`;

    for (const h of stats) {
      const members = (h.members_info || '').split(', ').filter(Boolean).map(m => {
        const match = m.match(/^(.+?) <(.+?)>$/);
        return match ? { name: match[1], email: match[2] } : { name: m, email: '' };
      });

      html += `
        <div class="household-card">
          <h3>${h.household_name}</h3>
          <div class="created">Utworzone: ${fmtDate(h.household_created)}</div>

          <div class="stat-row">
            <span class="stat-label">Ostatnie logowanie</span>
            <span class="stat-value ${h.last_login ? '' : 'dim'}">${fmt(h.last_login)}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Ostatni wydatek dodany</span>
            <span class="stat-value ${h.last_wydatek ? '' : 'dim'}">${fmt(h.last_wydatek)}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Liczba wydatków</span>
            <span class="stat-value">${h.wydatki_count}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Zapytania AI</span>
            <span class="stat-value">${h.api_calls} <span style="color:#aaa;font-weight:400">($${parseFloat(h.cost_usd).toFixed(4)})</span></span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Ostatnie zapytanie AI</span>
            <span class="stat-value ${h.last_api_call ? '' : 'dim'}">${fmt(h.last_api_call)}</span>
          </div>

          <div class="members-list">
            <div style="font-size:0.75rem;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Członkowie (${h.members_count})</div>
            ${members.map(m => `
              <div class="member-item">
                <span class="member-name">${m.name}</span>
                <span class="member-email">${m.email}</span>
              </div>`).join('')}
          </div>
        </div>`;
    }
    html += '</div><p style="font-size:0.75rem;color:#aaa;margin-top:8px">Ceny AI: $3/1M tokenów wejściowych, $15/1M wyjściowych (claude-sonnet-4-6)</p>';
    document.getElementById('stats-container').innerHTML = html;
  } catch (e) {
    document.getElementById('stats-container').innerHTML = '<p style="color:#d32f2f">Błąd: ' + e.message + '</p>';
  }
});
</script>
</body>
</html>
