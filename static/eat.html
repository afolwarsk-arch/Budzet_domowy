<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget: bez tego klawiatura telefonu nakrywa przycisk
       "Dodaj do dnia" zamiast przewinac arkusz nad nia. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Jedzenie — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/eat-skaner.js"></script>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <style>
    /* zostawiamy miejsce na przyklejony pasek bilansu + dolna nawigacje */
    main { padding-bottom: 132px; }

    .dzien-pasek { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .dzien-pasek h1 { margin: 0; font-size: 1.25rem; }
    /* Strzałki dnia to najczęściej klikany element na tej stronie — muszą mieć
       pełne 44 px, a nie 29 px wynikające z samego paddingu. */
    .dzien-pasek button { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                          min-width: 44px; min-height: 44px; padding: 6px 11px; cursor: pointer;
                          color: var(--text); font: inherit; font-size: 16px; line-height: 1; }

    .posilek { margin-bottom: 14px; }
    .pgl { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 6px; }
    .pgl b { font-size: 14px; }
    .pgl .sum { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .poz { display: flex; align-items: center; gap: 4px; padding: 0 11px 0 0; background: var(--surface);
           border: 1px solid var(--border-soft); border-radius: 10px; margin-bottom: 5px; }
    /* Treść wiersza jest przyciskiem (otwiera edycję), ale ma wyglądać jak
       wiersz — stąd zdjęte tło i obramowanie. Padding przeniesiony tutaj z
       .poz, żeby cała wysokość wiersza była klikalna, a nie sam tekst. */
    .poz-tresc { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
                 background: none; border: none; font: inherit; color: inherit; text-align: left;
                 padding: 10px 4px 10px 11px; min-height: 44px; cursor: pointer; border-radius: 10px; }
    .poz-tresc:hover { background: var(--surface-2); }
    .poz-tresc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .poz .nz { font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .poz .il { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
    .poz .kc { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .poz .x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 17px;
              line-height: 1; padding: 0 2px; min-width: 34px; min-height: 44px; flex: none; }
    .poz .x:hover { color: var(--danger); }
    /* ── danie złożone ze składników ──
       Wpisy zostają osobne (każdy z własną gramaturą do poprawienia), ale w
       dzienniku pokazują się pod jedną nazwą. Domyślnie zwinięte — po to jest
       grupowanie, żeby lista dnia nie puchła od pieczywa i sera osobno. */
    .grupa { margin-bottom: 5px; }
    .grupa-gl { margin-bottom: 0; }
    .grupa .strzalka { flex: none; color: var(--muted); font-size: 15px; line-height: 1;
                       transition: transform .15s; display: inline-block; width: 10px; }
    .grupa.rozwinieta .strzalka { transform: rotate(90deg); }
    @media (prefers-reduced-motion: reduce) { .grupa .strzalka { transition: none; } }
    .grupa-srodek { border-left: 2px solid var(--border); margin: 4px 0 0 13px; padding-left: 8px; }
    .poz-skl { background: var(--surface-2); }

    /* ── rozpiska dania z przepisu ──
       Danie wchodzi do dnia jako JEDEN wpis, ale ma pokazać, co w nim było.
       Składniki są tu tylko do oglądania — nie są osobnymi wpisami. */
    .strzalka-btn { background: none; border: none; cursor: pointer; flex: none;
                    min-width: 38px; min-height: 44px; padding: 0 0 0 10px; color: var(--muted); }
    .strzalka-btn .strzalka { display: inline-block; font-size: 15px; line-height: 1;
                              transition: transform .15s; }
    .strzalka-btn[aria-expanded="true"] .strzalka { transform: rotate(90deg); }
    @media (prefers-reduced-motion: reduce) { .strzalka-btn .strzalka { transition: none; } }
    .z-rozpiska .poz { padding-left: 0; }
    .z-rozpiska .poz-tresc { padding-left: 4px; }
    .rozpiska { border-left: 2px solid var(--border); margin: 2px 0 6px 21px;
                padding: 4px 0 4px 10px; }
    .rz { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; font-size: 12.5px; }
    .rz-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rz-g, .rz-k { flex: none; color: var(--muted); font-size: 11.5px; white-space: nowrap;
                   font-variant-numeric: tabular-nums; }
    .rz-g { width: 58px; text-align: right; }
    .rz-k { width: 62px; text-align: right; }
    .rz-stopka { font-size: 10.5px; color: var(--muted); margin-top: 5px; line-height: 1.35; }
    .dodaj-mini { border: 1px dashed var(--border); background: none; color: var(--muted); border-radius: 10px;
                  padding: 9px; width: 100%; font: inherit; font-size: 13px; cursor: pointer; }
    .dodaj-mini:hover { border-color: var(--accent); color: var(--accent); }

    /* ── przyklejony bilans dnia ── */
    .bilans {
      position: fixed; left: 0; right: 0; z-index: 60; bottom: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 14px rgba(0,0,0,.07);
    }
    /* Na telefonie pod spodem stoi dolna nawigacja (64 px) — pasek siada nad
       nią, a nie na niej. Na szerokim ekranie nawigacji nie ma, więc wraca do
       samego dołu. */
    @media (max-width: 700px) {
      .bilans { bottom: calc(64px + env(safe-area-inset-bottom)); padding-bottom: 10px; }
    }
    .bilans-in { max-width: 1100px; margin: 0 auto; display: flex; gap: 14px; }
    .bilans-in > div { flex: 1; min-width: 0; }
    .bl-n { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
    .bl-w { font-size: 13px; font-weight: 600; margin: 2px 0 3px; font-variant-numeric: tabular-nums; }
    /* Podpis pod liczbą, nie obok. W jednej linii „+847 ponad cel" nie mieściło
       się w kolumnie przy 320 px i wchodziło na sąsiednią; przy 360 px starczało
       co do piksela, więc szersza czcionka systemowa też by to rozwaliła. */
    .bl-w small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); line-height: 1.2; }
    .bl-d { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-variant-numeric: tabular-nums;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Flex, nie dwa bloki jeden pod drugim: odcinek „w celu" i odcinek
       „ponad cel" mają leżeć obok siebie na jednym torze. */
    .pas { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; display: flex; }
    .pas span { display: block; height: 100%; flex: none; transition: width .35s; }
    .pas span:first-child { border-radius: 3px 0 0 3px; }
    .pas span:last-child { border-radius: 0 3px 3px 0; }
    .pas span:only-child { border-radius: 3px; }
    /* Nadwyżka tym samym kolorem, tylko przygaszona — widać, że to ta sama
       rzecz, i widać gdzie kończył się cel. Bez czerwieni. */
    .pas-nad { opacity: .4; }
    @media (prefers-reduced-motion: reduce) { .pas span { transition: none; } }
    #bilans-uwaga { max-width: 1100px; margin: 6px auto 0; font-size: 11px; color: var(--muted); text-align: center; }
    #bilans-uwaga:empty { display: none; }
    @media (max-width: 700px) { .bilans-in { gap: 9px; } .bl-w { font-size: 12px; } .bl-d { font-size: 9px; } }

    /* Obszar przesuwania palcem musi sięgać poza ostatni wpis. Bez tego dzień
       z dwoma posiłkami dawał `main` wysokie na pół ekranu, a przeciągnięcie
       poniżej — czyli tam, gdzie kciuk trafia najczęściej — lądowało w pustym
       tle i nie zmieniało dnia. */
    main { min-height: 74vh; }

    /* ── arkusz dodawania ── */
    .ark-tlo { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9998;
               display: flex; align-items: flex-end; justify-content: center; }
    .ark { background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
           border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    @media (min-width: 560px) { .ark-tlo { align-items: center; } .ark { border-radius: 18px; } }
    .ark-gl { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .ark-gl h2 { margin: 0; font-size: 1.05rem; }
    .ark-gl .x { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 23px; cursor: pointer; line-height: 1; }

    .szukaj { display: flex; gap: 8px; margin-bottom: 12px; }
    .szukaj input { flex: 1; min-width: 0; }
    .mik { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 44px;
           cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
    .mik.slucha { border-color: var(--accent); color: var(--accent); }
    .mik svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }

    .drogi { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 16px; }
    .droga { border: 1px solid var(--border); border-radius: 12px; padding: 12px 11px; background: var(--surface-2);
             cursor: pointer; text-align: left; font: inherit; color: var(--text); }
    .droga.glowna { grid-column: span 2; background: var(--primary); border-color: var(--primary);
                    color: var(--on-primary); display: flex; align-items: center; gap: 12px; padding: 14px; }
    .droga svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .droga .t { font-size: 13.5px; font-weight: 600; display: block; margin-top: 6px; }
    .droga.glowna .t { margin-top: 0; font-size: 15px; }
    .droga .o { font-size: 11.5px; color: var(--muted); display: block; margin-top: 2px; line-height: 1.35; }
    .droga.glowna .o { color: rgba(251,249,244,.72); }

    .sek-tyt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
               font-weight: 700; margin: 0 0 8px; }
    .szybka { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--surface-2);
              border: 1px solid var(--border-soft); border-radius: 11px; margin-bottom: 6px; cursor: pointer;
              width: 100%; font: inherit; text-align: left; color: var(--text); }
    .szybka .nz { flex: 1; min-width: 0; overflow: hidden; }
    .szybka .nz b { font-size: 13.5px; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .szybka .nz span { font-size: 11.5px; color: var(--muted); }
    .szybka .kc { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ── ekran produktu ── */
    .prod-gora { text-align: center; padding: 2px 0 12px; }
    .prod-gora .marka { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
    .prod-gora h3 { margin: 4px 0 2px; font-size: 18px; color: var(--heading); }
    .prod-gora .op { font-size: 12.5px; color: var(--muted); }
    .zrodlo { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--good);
              background: var(--good-bg); border-radius: 20px; padding: 3px 10px; margin-top: 8px; }
    .porcje { display: flex; gap: 7px; flex-wrap: wrap; margin: 4px 0 12px; }
    /* 44 px to najmniejszy cel, w ktory palec trafia bez celowania. */
    .porcja { border: 1px solid var(--border); background: var(--surface); border-radius: 22px; padding: 8px 14px;
              min-height: 44px; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
    .porcja[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }

    /* ── wiersze porcji (produkt o znanych wartościach) ──
       Kazdy wiersz jest przyciskiem zapisu, wiec pokazuje SKUTEK wyboru:
       gramature i kalorie. Kolumny stale, zeby liczby stały w pionie i dawaly
       sie porownac wzrokiem bez czytania etykiet. */
    .porcje-lista { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    /* box-sizing jawnie: arkusz nie ma globalnego resetu, wiec <div> wiersza
       wlasnej krotnosci dostawal content-box i wychodzil poza liste o szerokosc
       wlasnego paddingu (23 px). Przyciski dziedzicza border-box, div nie. */
    .porcja-w { display: grid; grid-template-columns: 1fr auto auto 18px; align-items: center;
                box-sizing: border-box;
                gap: 10px; width: 100%; min-height: 48px; padding: 8px 10px 8px 13px;
                background: var(--surface-2); border: 1px solid var(--border-soft);
                border-radius: 11px; font: inherit; color: var(--text); text-align: left;
                cursor: pointer; }
    .porcja-w:hover { border-color: var(--primary); }
    .porcja-w[disabled] { opacity: .55; cursor: progress; }
    .pw-e { font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* tabular-nums: bez tego „100 g" i „97 g" skacza w poziomie miedzy wierszami */
    .pw-g { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pw-k { font-size: 13.5px; font-weight: 600; color: var(--heading);
            font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }
    .pw-s { font-size: 19px; color: var(--muted); line-height: 1; text-align: center; }
    button.pw-s { background: none; border: none; cursor: pointer; padding: 0; min-height: 44px; }

    /* Wiersz z wlasna krotnoscia ma wlasna siatke: pole i lista jednostek nie
       zmiescilyby sie w kolumnie etykiety przy 320 px. Gramatura i kalorie ida
       jedna pod druga, przez co ten wiersz potrzebuje tylko tyle szerokosci co
       najdluzsza z tych dwoch liczb. */
    .porcja-wlasna { grid-template-columns: auto auto 1fr 18px; cursor: default; }
    .porcja-wlasna:hover { border-color: var(--border-soft); }
    .porcja-wlasna input { width: 52px; padding: 6px 4px; text-align: center;
                           font-variant-numeric: tabular-nums; font-size: 13.5px; }
    .porcja-wlasna select { padding: 6px 2px; font: inherit; font-size: 13px; min-width: 0;
                            background: var(--surface); color: var(--text);
                            border: 1px solid var(--border); border-radius: 8px; }
    .pw-wynik { display: flex; flex-direction: column; align-items: flex-end;
                justify-content: center; min-width: 0; }
    .pw-wynik .pw-g { font-size: 11.5px; }
    .pw-wynik .pw-g:empty { display: none; }
    .pw-wynik .pw-k { min-width: 0; }

    /* Nazwa produktu siedzi w pasku tytulu, zeby wiersze porcji zaczynaly sie
       od razu pod nim — caly ekran ma sie miescic bez przewijania. */
    .ark-nazwa { flex: 1; min-width: 0; margin: 0; font-size: 1rem; font-weight: 620;
                 line-height: 1.25; color: var(--heading);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ark-marka { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 44 px, jak reszta celow dotykowych w arkuszu — nie 40 */
    .serce { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
             background: var(--surface); border: 1px solid var(--border);
             color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer;
             display: flex; align-items: center; justify-content: center; }
    .serce[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-border);
                                  background: var(--accent-soft); }
    .serce:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Zwijana linijka: chowa WYBOR POSILKU, nigdy wartosci odzywczych. */
    .zwin { display: flex; align-items: center; gap: 8px; width: 100%;
            background: none; border: none; border-top: 1px solid var(--border-soft);
            padding: 11px 2px 10px; margin: 0; min-height: 44px;
            color: var(--muted); font: inherit; font-size: 12.5px;
            text-align: left; cursor: pointer; }
    .zwin span:first-child { flex: 1; min-width: 0;
                             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .zwin[aria-expanded="true"] { color: var(--text); }
    .zwin[aria-expanded="true"] .zwin-strzalka { transform: rotate(180deg); }
    .zwin-strzalka { display: inline-block; font-size: 14px; line-height: 1; }
    .zwin:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .zwin-tresc { padding-top: 10px; }
    .zwin-tresc[hidden] { display: none; }

    /* Wyjscie do starego formularza przy edycji — dzialanie drugorzedne, wiec
       tekstowe, bez plaszczyzny konkurujacej z wierszami porcji. */
    .zwin-akcja { width: 100%; margin: 2px 0 4px; padding: 11px; min-height: 44px;
                  background: none; border: 1px solid var(--border); border-radius: 10px;
                  color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer; }
    .zwin-akcja:hover { border-color: var(--primary); }
    .zwin-akcja:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .na100 { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
             padding-top: 10px; border-top: 1px solid var(--border-soft); }
    .na100 b { color: var(--text); font-weight: 600; }

    /* Pasek cofniecia idzie na GORE: dol zajmuja juz bilans i nawigacja, a
       trzeci pasek nad nimi zaslanialby wpis, ktory wlasnie dodales. */
    .pasek-cofnij {
      position: fixed; z-index: 9999; left: 12px; right: 12px;
      top: calc(10px + env(safe-area-inset-top)); max-width: 520px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.18); font-size: 13px; color: var(--text);
    }
    .pasek-cofnij span { flex: 1; min-width: 0; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
    .pasek-cofnij button { background: none; border: none; color: var(--primary);
                           font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
                           padding: 6px 4px; min-height: 44px; }
    .wynik { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .wynik-kc { font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--heading); }
    .wynik-mk { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
    .wynik-mk b { color: var(--text); font-weight: 600; }
    .gdzie { display: flex; gap: 6px; margin-bottom: 12px; }
    .gdzie button { flex: 1; border: 1px solid var(--border); background: var(--surface); border-radius: 9px;
                    padding: 8px 3px; min-height: 44px; font: inherit; font-size: 12px; cursor: pointer; color: var(--text); }
    .gdzie button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
    .cta { width: 100%; padding: 13px; border: none; border-radius: 11px; background: var(--primary);
           color: var(--on-primary); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .cta[disabled] { opacity: .55; cursor: not-allowed; }
    /* Usuwanie ma być dostępne, ale nie ma konkurować wzrokowo z zapisem —
       stąd tekstowy przycisk, nie druga kolorowa płachta. */
    .cta-usun { width: 100%; margin-top: 8px; padding: 11px; background: none; border: none;
                border-radius: 11px; color: var(--danger); font: inherit; font-size: 13.5px;
                cursor: pointer; min-height: 44px; }
    .cta-usun:hover { background: var(--danger-bg); }
    .cta-usun[disabled] { opacity: .55; cursor: not-allowed; }

    #skaner-wrap { display: none; margin-bottom: 12px; }
    #skaner { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3; object-fit: cover; }
    .komunikat { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 8px 0; }
    .komunikat.blad { color: var(--danger); }

    /* ── ekran potwierdzenia pozycji ── */
    .makro-siatka { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
    .makro-siatka label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px;
                          text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
    .makro-siatka input { width: 100%; padding: 8px 6px; text-align: center;
                          font-variant-numeric: tabular-nums; font-size: 14px; }

    /* ── lista pozycji z opisu ── */
    .poz-edyt { display: flex; align-items: center; gap: 10px; padding: 9px 11px;
                background: var(--surface-2); border: 1px solid var(--border-soft);
                border-radius: 11px; margin-bottom: 6px; }
    .poz-edyt input[type=checkbox] { width: 18px; height: 18px; flex: none; }
    .pe-nazwa { font-size: 13.5px; font-weight: 500; }
    .pe-linia { display: flex; align-items: center; gap: 6px; margin-top: 3px;
                font-size: 12px; color: var(--muted); }
    .pe-linia input { width: 74px; padding: 5px 7px; font-size: 13px; text-align: center; }
    .pe-kcal { margin-left: auto; font-weight: 600; color: var(--text);
               font-variant-numeric: tabular-nums; }

    /* ── cel dzienny ── */
    .cel-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .cel-row label { flex: 1; font-size: 13.5px; }
    .cel-row input { width: 88px; text-align: center; font-variant-numeric: tabular-nums; }
    .cel-jedn { font-size: 12.5px; color: var(--muted); width: 12px; }
    .cel-obok { font-size: 12.5px; color: var(--muted); width: 58px; text-align: right;
                font-variant-numeric: tabular-nums; }
    .dzien-niepelny { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px;
                      padding: 11px 12px; border: 1px dashed var(--border); border-radius: 10px;
                      cursor: pointer; }
    .dzien-niepelny input { width: 20px; height: 20px; flex: none; margin-top: 1px; cursor: pointer; }
    .dzien-niepelny b { display: block; font-size: 13px; font-weight: 600; }
    .dzien-niepelny small { display: block; font-size: 11.5px; color: var(--muted);
                            line-height: 1.35; margin-top: 2px; }
    /* Zaznaczony dzień ma być widoczny od razu po wejściu — inaczej łatwo
       zapomnieć, że statystyka go pomija. */
    .dzien-niepelny:has(input:checked) { border-style: solid; border-color: var(--accent); }

    .mini-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
                padding: 2px 9px; font: inherit; font-size: 11.5px; cursor: pointer;
                color: var(--accent); margin-left: 4px; }

    /* ── ekran oczekiwania ──
       Dwie kropki ze znaku krążące wokół wspólnego środka. Aparat systemowy
       zamyka się natychmiast po zdjęciu, a odczyt trwa kilka sekund — bez tego
       ekran wygląda tak, jakby zdjęcie nic nie wywołało. */
    .czekaj { display: flex; flex-direction: column; align-items: center; justify-content: center;
              text-align: center; padding: 54px 20px 46px; }
    .czekaj-znak { position: relative; width: 54px; height: 54px; margin-bottom: 20px; }
    .czekaj-znak i { position: absolute; top: 50%; left: 50%; width: 11px; height: 11px;
                     margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--marka);
                     animation: kropki-orbita 1.15s linear infinite; }
    /* Druga kropka po przeciwnej stronie okręgu — pół obrotu opóźnienia. */
    .czekaj-znak i:nth-child(2) { animation-delay: -.575s; opacity: .5; }
    @keyframes kropki-orbita {
      from { transform: rotate(0deg) translateX(19px); }
      to   { transform: rotate(360deg) translateX(19px); }
    }
    .czekaj-t { font-size: 15px; font-weight: 600; color: var(--heading); }
    .czekaj-o { font-size: 12.5px; color: var(--muted); margin-top: 5px; max-width: 30ch; line-height: 1.4; }
    /* Przy wyłączonych animacjach kropki po prostu pulsują w miejscu. */
    @media (prefers-reduced-motion: reduce) {
      .czekaj-znak i { animation: kropki-puls 1.2s ease-in-out infinite; }
      .czekaj-znak i:nth-child(1) { transform: translateX(-11px); }
      .czekaj-znak i:nth-child(2) { transform: translateX(11px); animation-delay: -.6s; }
      @keyframes kropki-puls { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    }

    /* Pole pliku „schowane", a nie display:none — pole z display:none bywa
       traktowane jak nieistniejące i odmawia otwarcia aparatu, bez żadnego
       błędu. Tu jest nadal renderowane, tylko niewidoczne. */
    .schowane { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    /* Etykiety otwierające aparat mają wyglądać i reagować jak przyciski. */
    label.droga, label.cta { cursor: pointer; }
    label.droga:focus-visible, label.cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
