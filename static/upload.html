<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodaj wydatek — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preload" as="script" href="/static/auth.js">
  <link rel="preload" as="script" href="/static/app.js">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://securetoken.googleapis.com">
</head>
<body>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="/static/auth.js"></script>
<nav>
  <a href="/" class="logo">w<span class="lg-i">ı<i class="lg-kropka"></i></span>em<i class="lg-kropka"></i></a>
</nav>

<main style="max-width:720px">
  <!-- Pole aparatu MUSI byc poza #ekran-skanu i #ekran-pelny: przegladarka
       nie otworzy okna wyboru z pola ukrytego przez display:none. -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
  <!-- Tryb ekspresowy (?skan=1 ze skrotu aplikacji): jeden wielki przycisk
       i nic wiecej. Aparatu nie da sie otworzyc bez dotkniecia ekranu, wiec
       zamiast udawac automat skracamy droge do jednego dotkniecia. -->
  <div id="ekran-skanu" style="display:none">
    <button type="button" id="btn-skan" class="skan-cel">
      <span class="ikona"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 8.4a2 2 0 012-2h2.2l1.4-2.2h5.6l1.4 2.2h2.6a2 2 0 012 2v9.2a2 2 0 01-2 2H5.4a2 2 0 01-2-2z"/><circle cx="12" cy="12.6" r="3.8"/><circle class="kropka" cx="12" cy="12.6" r="1.4"/></svg></span>
      <span class="skan-napis">Zrób zdjęcie paragonu</span>
      <span class="skan-drobne">Resztę zrobi AI — pozycje i kategorie</span>
    </button>
    <button type="button" id="btn-skan-pelny" class="skan-wyjscie">Pokaż wszystkie opcje</button>
  </div>

  <div id="ekran-pelny">
  <h1 id="page-title">Dodaj wydatek</h1>

  <div id="alert" class="hidden"></div>

  <div class="card" style="margin-bottom:18px">
    <div class="form-group" style="margin-bottom:0">
      <label>Czyje wydatki?</label>
      <select id="osoba" style="width:200px"></select>
    </div>
  </div>

  <div class="card" style="margin-bottom:18px">
    <div class="tabs">
      <button class="tab-btn active" id="tab-image">Zdjęcie paragonu</button>
      <button class="tab-btn" id="tab-text">Notatka tekstowa</button>
      <button class="tab-btn" id="tab-manual"><span class="ikona"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.2L15.6 5.4a2.2 2.2 0 013.1 3.1L8.2 18.8z"/><path d="M14 7l3 3"/><circle class="kropka" cx="5.2" cy="18.8" r="1.5"/></svg></span> Ręcznie (bez AI)</button>
    </div>

    <div id="panel-image">
      <button class="btn btn-primary btn-camera" id="btn-camera"><span class="ikona"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 8.4a2 2 0 012-2h2.2l1.4-2.2h5.6l1.4 2.2h2.6a2 2 0 012 2v9.2a2 2 0 01-2 2H5.4a2 2 0 01-2-2z"/><circle cx="12" cy="12.6" r="3.8"/><circle class="kropka" cx="12" cy="12.6" r="1.4"/></svg></span> Zrób zdjęcie paragonu</button>
      <div class="drop-zone" id="drop-zone">
        <div class="icon"><span class="ikona"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 8.4a2 2 0 012-2h2.2l1.4-2.2h5.6l1.4 2.2h2.6a2 2 0 012 2v9.2a2 2 0 01-2 2H5.4a2 2 0 01-2-2z"/><circle cx="12" cy="12.6" r="3.8"/><circle class="kropka" cx="12" cy="12.6" r="1.4"/></svg></span></div>
        <p>Przeciągnij zdjęcie lub kliknij, by wybrać plik</p>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none">
      </div>
      <div id="preview-thumbs" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
    </div>

    <div id="panel-text" class="hidden">
      <div class="form-group">
        <label>Wpisz wydatki (każda linia to osobny wpis)</label>
        <textarea id="text-input" placeholder="18.06 bułka w automacie 7,80&#10;18.06 Avonlea dla Oli 45&#10;19.06 bułka 7,80"></textarea>
      </div>
    </div>

    <div id="panel-manual" class="hidden">
      <p style="font-size:14px;color:var(--muted);margin:4px 0 14px;line-height:1.5">
        Wpisz wydatek samodzielnie — <strong>bez wysyłania do Claude AI</strong>. Nie zużywa API,
        działa bez limitów. Podaj sklep, pozycje z kategoriami i kwotę, a potem zapisz. Sumę policzę
        z pozycji, jeśli jej nie wpiszesz.
      </p>
      <button class="btn btn-primary" id="btn-manual-start">+ Nowy wpis ręczny</button>
    </div>

    <div class="form-group" id="ai-hint-group" style="margin-top:12px;margin-bottom:4px">
      <label>Wskazówka dla AI <span style="font-weight:400;color:var(--muted)">(opcjonalnie)</span></label>
      <input type="text" id="kontekst-input" placeholder="np. meble na Gałczyńskiego, zakupy dla dziecka..." style="width:100%">
    </div>
    <button class="btn btn-primary" id="btn-analyze" disabled>Analizuj z Claude AI</button>
  </div>

  <div id="ai-loading" class="hidden" style="margin-bottom:18px"></div>

  <div id="result-section" class="hidden">
    <div id="paragony-cards"></div>

    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-primary" id="btn-save-all">Zapisz wszystkie</button>
      <a href="/" class="btn btn-outline">Anuluj</a>
    </div>
  </div>
  </div>
</main>


<script>
  // Tryb ekspresowy musi dzialac natychmiast: przycisk aparatu nie potrzebuje
  // ani logowania, ani danych z serwera. Czekanie na Firebase i app.js (86 kB)
  // opoznialo go o sekundy. app.js pozniej tylko dokleja obsluge wyniku.
  (function () {
    var wejscie = document.getElementById('camera-input');

    // Przycisk aparatu w PELNYM widoku tez podpinamy od razu — app.js robi to
    // dopiero po pobraniu danych, wiec do tego czasu przycisk byl martwy.
    var wczesnyAparat = function () {
      var we = document.getElementById('camera-input');
      var btn = document.getElementById('btn-camera');
      if (btn && we) btn.addEventListener('click', function () { we.click(); });
      if (we) we.addEventListener('change', function () {
        // jesli app.js jeszcze nie wystartowal, odkladamy pliki na bok
        if (!window._aparatGotowy && we.files && we.files.length) {
          window._czekajaceZdjecia = we.files;
        }
      });
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wczesnyAparat);
    } else { wczesnyAparat(); }

    if (!new URLSearchParams(location.search).has('skan')) return;
    var pokaz = function () {
      var skan = document.getElementById('ekran-skanu');
      var pelny = document.getElementById('ekran-pelny');
      var wejscie = document.getElementById('camera-input');
      if (!skan || !wejscie) return;
      skan.style.display = 'block';
      if (pelny) pelny.style.display = 'none';
      document.getElementById('btn-skan').onclick = function (e) {
        e.currentTarget.classList.add('czeka');
        wejscie.click();
      };
      document.getElementById('btn-skan-pelny').onclick = function () {
        skan.style.display = 'none';
        if (pelny) pelny.style.display = '';
      };
      window.addEventListener('focus', function () {
        var b = document.getElementById('btn-skan');
        if (b) b.classList.remove('czeka');
      });
      wejscie.addEventListener('change', function () {
        skan.style.display = 'none';
        if (pelny) pelny.style.display = '';
      });
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', pokaz);
    } else { pokaz(); }
  })();
</script>
<script defer src="/static/app.js?v=8"></script>
</body>
</html>
