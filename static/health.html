<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Historia zdrowia — Wiem</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1d20">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="/static/auth.js"></script>
  <style>
    main { padding-bottom: 96px; }
    .gora { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .gora h1 { margin: 0; font-size: 1.25rem; }

    /* Wejście na dokument. Dwa przyciski, bo to dwie różne czynności:
       zrobienie zdjęcia teraz i wzięcie gotowego pliku z dysku (PDF albo zdjęcie
       z galerii — np. wynik przysłany mailem lub sfotografowany wcześniej). */
    .wejscia { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .wejscie { border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
               padding: 16px 12px; text-align: center; cursor: pointer; font: inherit;
               color: var(--text); display: flex; flex-direction: column; align-items: center;
               gap: 7px; min-height: 88px; justify-content: center; }
    .wejscie:hover { border-color: var(--accent); }
    .wejscie b { font-size: 14px; font-weight: 600; color: var(--heading); }
    .wejscie span { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
    .wejscie svg { width: 24px; height: 24px; stroke: var(--muted); fill: none;
                   stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    /* Pole pliku NIE MOŻE być w display:none — na iPhonie ukryty w ten sposób
       input nie reaguje na programowe kliknięcie. Chowamy je rozmiarem. */
    .wejscia input[type=file] { position: absolute; width: 1px; height: 1px;
                                opacity: 0; pointer-events: none; }
    /* To samo pole, ale na ekranie podglądu — dokładanie kolejnej strony. */
    .plik-ukryty { position: absolute; width: 1px; height: 1px;
                   opacity: 0; pointer-events: none; }
    .dokladanie b { font-size: 14px; color: var(--heading); }
    .dokladanie .uwaga { margin: 6px 0 12px; }

    /* Ekran oczekiwania — bez niego po wybraniu pliku przez kilkanaście sekund
       nic się nie dzieje i wygląda to, jakby przycisk nie zadziałał. */
    .czekaj { display: flex; flex-direction: column; align-items: center; justify-content: center;
              text-align: center; padding: 54px 20px 46px; }
    .czekaj-znak { position: relative; width: 54px; height: 54px; margin-bottom: 20px; }
    .czekaj-znak i { position: absolute; top: 50%; left: 50%; width: 11px; height: 11px;
                     margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--marka);
                     animation: kropki-orbita 1.15s linear infinite; }
    .czekaj-znak i:nth-child(2) { animation-delay: -.575s; opacity: .5; }
    @keyframes kropki-orbita {
      from { transform: rotate(0deg) translateX(19px); }
      to   { transform: rotate(360deg) translateX(19px); }
    }
    @media (prefers-reduced-motion: reduce) { .czekaj-znak i { animation: none; } }
    .czekaj b { font-size: 15px; color: var(--heading); }
    .czekaj span { font-size: 13px; color: var(--muted); margin-top: 6px; max-width: 30ch; }
    /* Pasek wysyłki. Widoczny tylko dopóki plik leci na serwer — potem znika,
       bo w czasie samego odczytu nie ma czego odmierzać i pełny pasek stojący
       nieruchomo wygląda jak zawieszony. */
    .czekaj-pasek { width: 190px; height: 4px; margin-top: 16px; border-radius: 2px;
                    background: var(--border); overflow: hidden; }
    .czekaj-pasek i { display: block; height: 100%; width: 0; border-radius: 2px;
                      background: var(--marka); transition: width .15s linear; }

    /* Kto przyjmował — specjalista, lekarz, forma wizyty. Osobna linia pod
       nazwą wpisu, bo przy wizycie to ona jest właściwą informacją: „Konsultacja"
       nic nie mówi, „stomatolog · dr Kowalska" mówi wszystko. */
    .os-kto, .dok-kto { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .dok-kto { margin-top: 6px; }

    /* ── skierowanie ──
       Kod e-skierowania jest tu najważniejszy: to jego dyktuje się przez telefon
       przy rejestracji. Duży, w jednej linii, z odstępami między cyframi. */
    .kod-e { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
             margin-bottom: 8px; }
    .kod-e-etykieta { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
                      color: var(--muted); font-weight: 700; }
    .kod-e-cyfry { font-size: 26px; font-weight: 700; letter-spacing: .18em;
                   color: var(--heading); font-variant-numeric: tabular-nums; }
    .wazne-do { color: var(--good); font-weight: 600; }
    .wazne-po { color: var(--danger); font-weight: 600; }

    /* ── leki ──
       Wiersz na preparat, a nie proza: „co pan przyjmuje?" to pytanie padające
       przy każdej wizycie i odpowiedź ma się dać przeczytać jednym spojrzeniem. */
    .lek { padding: 8px 0; border-bottom: 1px solid var(--border-soft); }
    .lek:last-child { border-bottom: none; padding-bottom: 0; }
    .lek-nazwa { font-size: 14px; color: var(--heading); font-weight: 600; }
    .lek-dawka { font-weight: 400; color: var(--muted); }
    .lek-pod { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    /* Pouczenia są zwinięte, bo na karcie teleporady formuły o SOR-ze i numerze
       112 potrafią zająć trzy czwarte tekstu i przykryć właściwą treść wizyty. */
    .pouczenia summary { font-size: 15px; font-weight: 600; color: var(--heading);
                         cursor: pointer; }
    .pouczenia .proza { margin-top: 10px; color: var(--muted); font-size: 13px; }

    /* Podpis pod nagłówkiem dokumentu (rodzaj, data, placówka, numer). */
    .dok-pod { font-size: 12.5px; color: var(--muted); margin-top: 4px;
               display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .znacznik { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
                font-weight: 700; padding: 2px 6px; border-radius: 4px;
                background: var(--surface-3); color: var(--muted); }

    /* ── tabela wyników ── */
    .wyniki { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .wyniki th { text-align: left; font-size: 10.5px; text-transform: uppercase;
                 letter-spacing: .06em; color: var(--muted); font-weight: 700;
                 padding: 7px 8px; border-bottom: 1px solid var(--border); }
    .wyniki td { padding: 8px; border-bottom: 1px solid var(--border-soft);
                 vertical-align: baseline; }
    .wyniki tr:last-child td { border-bottom: none; }
    .w-wart { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--heading);
              white-space: nowrap; }
    .w-norma { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
               white-space: nowrap; }
    /* Flaga jest PRZEPISANA z wyniku, nie policzona — dlatego pokazujemy dokładnie
       ten znak, który był na papierze, a kolorem tylko go uwypuklamy. */
    .flaga { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 5px;
             border-radius: 4px; background: var(--danger-bg); color: var(--danger);
             border: 1px solid var(--danger-border); margin-left: 6px; }
    .w-grupa td { background: var(--surface-2); font-size: 11px; text-transform: uppercase;
                  letter-spacing: .06em; color: var(--muted); font-weight: 700; }

    .karta { border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
             padding: 14px 15px; margin-bottom: 14px; }
    .karta h2 { font-size: 15px; margin-bottom: 10px; }
    .karta .przewin { overflow-x: auto; }
    .proza { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; }
    .pole { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
    .pole label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
                  color: var(--muted); font-weight: 700; }
    .pole input, .pole select, .pole textarea {
      border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px;
      font: inherit; font-size: 14px; background: var(--surface); color: var(--text);
      min-height: 44px; width: 100%; }
    .pole textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
    .pola-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    /* Przyciski biorą wygląd z systemu (.btn + .btn-primary/-outline/-danger)
       — tutaj tylko rozciągamy je na szerokość, bo na telefonie mają być
       łatwe do trafienia kciukiem. */
    .akcje { display: flex; gap: 9px; margin-top: 4px; }
    .akcje .btn { flex: 1; min-height: 46px; justify-content: center; font-size: 14.5px; }

    .pusto { text-align: center; color: var(--muted); padding: 34px 18px; font-size: 14px;
             line-height: 1.55; }
    .laduje { text-align: center; color: var(--muted); padding: 30px; font-size: 15px; }
    .blad { background: var(--danger-bg); border: 1px solid var(--danger-border);
            color: var(--danger); border-radius: 10px; padding: 11px 13px; font-size: 13.5px;
            margin-bottom: 14px; }
    .uwaga { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }

    .wroc { background: none; border: none; color: var(--muted); font: inherit; font-size: 13.5px;
            cursor: pointer; padding: 6px 0; margin-bottom: 8px; }
    .wroc:hover { color: var(--accent); }

    /* ── paleta problemów ──
       Osiem slotów w STAŁEJ kolejności — problem dostaje indeks, nie hex, więc
       paletę da się poprawić bez migracji danych. Kolejność nie jest ozdobna:
       sąsiednie sloty są dobrane tak, żeby dało się je odróżnić przy
       daltonizmie (sprawdzone walidatorem na tle #ffffff i #1e2126 — najgorsza
       para ΔE 9,1 jasny / 8,4 ciemny).

       W motywie jasnym akwamaryna, żółty i magenta mają kontrast poniżej 3:1
       wobec tła. Dlatego przy KAŻDEJ kropce stoi nazwa problemu tekstem i nic
       nie jest przekazywane samym kolorem — bez tej zasady paleta nie
       przechodzi. Nie usuwaj etykiet z osi. */
    :root {
      --pr-0: #2a78d6; --pr-1: #eb6834; --pr-2: #1baf7a; --pr-3: #eda100;
      --pr-4: #e87ba4; --pr-5: #008300; --pr-6: #4a3aa7; --pr-7: #e34948;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --pr-0: #3987e5; --pr-1: #d95926; --pr-2: #199e70; --pr-3: #c98500;
        --pr-4: #d55181; --pr-5: #008300; --pr-6: #9085e9; --pr-7: #e66767;
      }
    }
    :root[data-theme="dark"] {
      --pr-0: #3987e5; --pr-1: #d95926; --pr-2: #199e70; --pr-3: #c98500;
      --pr-4: #d55181; --pr-5: #008300; --pr-6: #9085e9; --pr-7: #e66767;
    }

    /* ── pasek narzędzi osi ── */
    .narzedzia { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .filtry { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
            padding: 7px 12px; min-height: 38px; font: inherit; font-size: 12.5px;
            cursor: pointer; color: var(--text); display: inline-flex; align-items: center;
            gap: 6px; }
    .chip[aria-pressed="true"] { border-color: var(--marka); background: var(--surface-2);
            font-weight: 600; }
    .chip.dodaj { border-style: dashed; color: var(--muted); }
    /* Filtr ustawiony z arkusza. Wyróżniony mocniej niż zwykły chip wciśnięty,
       bo jego przyczyna jest schowana — bez tego oś potrafi wyglądać na pustą,
       a powód siedzi w oknie, którego nie widać. */
    .chip.wlaczony { border-color: var(--marka); background: var(--accent-soft);
            color: var(--accent-strong); font-weight: 600; }
    .kropka-pr { width: 9px; height: 9px; border-radius: 50%; flex: none; }

    /* Arkusz filtrów korzysta ze stylu przełącznika modułów (przelacznik-tlo),
       dokłada tylko odstępy pól i rząd przycisków na dole. */
    .arkusz-filtry .pole { margin-bottom: 12px; }
    .arkusz-filtry .akcje { display: flex; gap: 9px; margin-top: 4px; }
    .arkusz-filtry .akcje button { flex: 1; }
    .arkusz-filtry select:disabled { color: var(--muted); background: var(--surface-2); }

    /* Suwak skali — zmienia gęstość osi, nie zakres danych. Oś zawsze pokazuje
       wszystko; skala decyduje tylko, ile pikseli dostaje dzień. */
    .skala { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .skala input { flex: 1; min-width: 120px; accent-color: var(--marka); }

    /* ── oś czasu ── */
    .os { position: relative; padding-left: 34px; }
    /* Linia biegnie przez całą oś i jest tłem, nie treścią — stąd cieńsza niż
       obramowania kart i w kolorze obramowania, nie tekstu. */
    .os::before { content: ""; position: absolute; left: 9px; top: 4px; bottom: 4px;
                  width: 2px; background: var(--border); border-radius: 1px; }
    .os-rok { position: relative; font-size: 11px; text-transform: uppercase;
              letter-spacing: .07em; font-weight: 700; color: var(--muted);
              margin: 0 0 10px -34px; padding-left: 34px; }
    .os-rok::after { content: ""; display: block; height: 1px; background: var(--border);
                     margin-top: 6px; }
    .os-cisza { position: relative; font-size: 11px; color: var(--muted); font-style: italic;
                margin-left: -12px; }
    .os-wpis { position: relative; display: block; width: 100%; text-align: left;
               border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
               padding: 11px 13px; font: inherit; color: var(--text); cursor: pointer; }
    .os-wpis:hover { border-color: var(--marka); }
    /* Kropka siedzi na linii, nie obok — dlatego ujemny lewy margines równy
       wcięciu osi, a nie pozycjonowanie względem karty. */
    .os-wpis::before { content: ""; position: absolute; left: -29px; top: 16px;
                       width: 11px; height: 11px; border-radius: 50%;
                       background: var(--surface); border: 2.5px solid var(--muted); }
    .os-wpis.ma-problem::before { border-color: var(--pr-akt); }
    .os-gl { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .os-nazwa { font-weight: 600; font-size: 14px; color: var(--heading); }
    .os-data { font-size: 11.5px; color: var(--muted); white-space: nowrap;
               font-variant-numeric: tabular-nums; }
    .os-pod { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex;
              gap: 7px; flex-wrap: wrap; align-items: center; }
    .etykieta-pr { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
                   color: var(--text); background: var(--surface-2); border-radius: 999px;
                   padding: 2px 8px 2px 6px; }
    .os-osoba { font-size: 11px; font-weight: 700; text-transform: uppercase;
                letter-spacing: .05em; color: var(--muted); }
    .poza-norma { color: var(--danger); font-weight: 600; }

    /* ── wykres przebiegu parametru ──
       Jedna seria, więc bez legendy — tytuł nad wykresem nazywa parametr.
       Marki cienkie, siatka recesywna: linia ma być najciemniejszą rzeczą
       w kadrze, a nie konkurować z ramką i opisami. */
    .wykres { width: 100%; display: block; }
    .wykres .siatka { stroke: var(--border); stroke-width: 1; }
    .wykres .pasmo { fill: var(--surface-2); }
    .wykres .pasmo-ramka { stroke: var(--border); stroke-width: 1; fill: none;
                           stroke-dasharray: 3 3; }
    .wykres .linia { fill: none; stroke: var(--marka); stroke-width: 2;
                     stroke-linejoin: round; stroke-linecap: round; }
    /* Obwódka w kolorze tła odcina punkt od linii, gdy pomiary leżą gęsto. */
    .wykres .punkt { fill: var(--marka); stroke: var(--surface); stroke-width: 2; }
    .wykres .punkt.flaga { fill: var(--danger); }
    .wykres .opis { fill: var(--muted); font-size: 11px; }
    .wykres .wartosc { fill: var(--heading); font-size: 11.5px; font-weight: 600; }
    .wykres .dotyk { fill: transparent; cursor: pointer; }

    .wyk-karta { border: 1px solid var(--border); border-radius: 12px;
                 background: var(--surface); padding: 14px 15px; margin-bottom: 14px; }
    .wyk-gl { display: flex; align-items: baseline; justify-content: space-between;
              gap: 10px; margin-bottom: 10px; }
    .wyk-gl h2 { margin: 0; font-size: 15px; }
    .wyk-podpis { font-size: 12.5px; color: var(--muted); min-height: 18px; margin-top: 8px; }

    @media (max-width: 560px) { .pola-2 { grid-template-columns: 1fr; } }
  </style>
</head>
