<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listy zakupów — Budżet domowy</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4f7ef8">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://securetoken.googleapis.com">
  <style>
    .lz-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .lz-tab { padding:7px 13px; border:1px solid var(--border); border-radius:20px; background:var(--card,#fff); color:inherit;
              cursor:pointer; font-size:13.5px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
    .lz-tab.active { background:#4f7ef8; color:#fff; border-color:#4f7ef8; }
    .lz-tab-new { padding:7px 13px; border:1px dashed #9db4e8; border-radius:20px; background:none; color:#4f7ef8; cursor:pointer; font-size:13.5px; }
    .lz-badge { background:rgba(0,0,0,.12); border-radius:10px; padding:0 7px; font-size:12px; min-width:18px; text-align:center; }
    .lz-tab.active .lz-badge { background:rgba(255,255,255,.3); }
    .lz-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .lz-title { margin:0; font-size:1.15rem; flex:1; word-break:break-word; }
    .lz-actions { display:flex; gap:5px; flex:none; }
    .lz-actions button { border:1px solid var(--border); background:var(--card,#fff); border-radius:8px; padding:5px 9px; font-size:14px; cursor:pointer; line-height:1; }
    .lz-add { display:flex; gap:8px; margin-bottom:8px; }
    .lz-add input { flex:1; min-width:0; padding:13px 15px; border:1px solid var(--border); border-radius:12px; font-size:16px; outline:none; }
    .lz-status { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .lz-dot { width:9px; height:9px; border-radius:50%; background:#bbb; flex:none; }
    .lz-dot.on { background:#22b866; }
    .lz-dot.wait { background:#f0ad3c; animation:lzpulse 1s infinite; }
    @keyframes lzpulse { 50% { opacity:.35; } }
    .lz-row { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px; background:var(--card,#fff);
              border:1px solid var(--border); margin-bottom:5px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
    .lz-row:active { transform:scale(.995); }
    .lz-handle { flex:none; color:#b7bece; font-size:16px; cursor:grab; padding:0 1px; line-height:1; touch-action:none; }
    .lz-check { width:21px; height:21px; border-radius:50%; border:2px solid #cfd6e4; flex:none; display:flex; align-items:center;
                justify-content:center; font-size:13px; color:#fff; }
    .lz-row.done .lz-check { background:#22b866; border-color:#22b866; }
    .lz-name { flex:1; font-size:15px; line-height:1.25; word-break:break-word; }
    .lz-who { font-size:11px; color:var(--muted); }
    .lz-row.done .lz-name { text-decoration:line-through; color:var(--muted); }
    .lz-del { flex:none; width:30px; height:30px; border:none; background:none; color:#c0392b; font-size:19px; cursor:pointer;
              border-radius:8px; line-height:1; }
    .lz-row.pending { opacity:.55; }
    .lz-drag-ghost { opacity:.35; }
    .lz-sekcja { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 2px 8px; }
    .lz-empty { text-align:center; color:var(--muted); padding:28px 12px; font-size:15px; }
    .lz-arch-row { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; margin-bottom:6px; }
    .kal-chip { padding:9px 13px; border:1px solid var(--border); border-radius:20px; background:var(--card,#fff); color:inherit;
                font-size:14px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .kal-chip:active { transform:scale(.96); }
    .kal-chip.kal-on { background:#4f7ef8; border-color:#4f7ef8; color:#fff; }
  </style>
</head>
<body>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script defer src="/static/auth.js"></script>
<nav>
  <a href="/" class="logo">🏠 Budżet</a>
  <a href="/">Dashboard</a>
  <a href="/upload">Dodaj wydatek</a>
  <a href="/lista" class="active">Lista</a>
  <a href="/konta">Konta</a>
  <a href="/wplywy">Wpływy</a>
  <a href="/cele">Cele</a>
  <a href="/kategorie">Kategorie</a>
  <a href="/analiza">Analiza</a>
  <a href="/powiadomienia">Powiadomienia</a>
  <button onclick="authLogout()" style="margin-left:auto;padding:6px 14px;cursor:pointer;border:1px solid #ccc;border-radius:6px;background:white;font-size:0.85rem;">Wyloguj</button>
</nav>

<main style="max-width:640px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <h1 style="margin:0">🛒 Listy zakupów</h1>
    <div class="lz-status"><span id="lz-dot" class="lz-dot wait"></span><span id="lz-status-txt">Łączę…</span></div>
  </div>
  <div id="lz-tabs" class="lz-tabs"></div>
  <div id="lz-panel"></div>
  <div id="lz-archiwum"></div>
</main>

<script>
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let stan = [];                                             // [{id,nazwa,status,pozycja,pozycje:[...]}]
let selId = parseInt(localStorage.getItem('listaSel') || '0', 10) || null;
let ws = null, wsWanted = true, reconnectTimer = null, pingTimer = null, pollTimer = null, sortable = null;

const tabsEl = document.getElementById('lz-tabs');
const panelEl = document.getElementById('lz-panel');
const archEl = document.getElementById('lz-archiwum');

function wsOpen() { return ws && ws.readyState === 1; }
function listaById(id) { return stan.find(l => l.id === Number(id)); }
function aktywne() { return stan.filter(l => l.status === 'aktywna'); }

function selected() {
  let l = stan.find(x => x.id === selId && x.status === 'aktywna');
  if (!l) { l = aktywne()[0] || null; selId = l ? l.id : null; }
  return l;
}

function setStatus(state) {
  const dot = document.getElementById('lz-dot');
  const txt = document.getElementById('lz-status-txt');
  dot.className = 'lz-dot ' + (state === 'online' ? 'on' : state === 'wait' ? 'wait' : '');
  txt.textContent = state === 'online' ? 'Na żywo' : state === 'wait' ? 'Łączę…' : 'Offline — łączę ponownie';
}

// ── render ──

function renderAll() { renderTabs(); renderPanel(); renderArch(); }

function renderTabs() {
  const a = aktywne();
  const sel = selected();
  tabsEl.innerHTML = a.map(l => {
    const n = l.pozycje.filter(p => !p.kupione).length;
    return `<button class="lz-tab ${sel && l.id === sel.id ? 'active' : ''}" data-sel="${l.id}">${esc(l.nazwa)}${n ? ` <span class="lz-badge">${n}</span>` : ''}</button>`;
  }).join('') + `<button class="lz-tab-new" id="btn-nowa">+ Nowa lista</button>`;
  tabsEl.querySelectorAll('[data-sel]').forEach(b => b.addEventListener('click', () => {
    selId = parseInt(b.dataset.sel); localStorage.setItem('listaSel', String(selId)); renderAll();
  }));
  document.getElementById('btn-nowa').addEventListener('click', nowaLista);
}

function renderPanel() {
  // zachowaj wpisywany tekst i fokus pola dodawania przez przebudowę
  const prev = document.getElementById('add-input');
  const prevVal = prev ? prev.value : null;
  const hadFocus = prev && document.activeElement === prev;

  const l = selected();
  if (!l) {
    if (sortable) { sortable.destroy(); sortable = null; }
    panelEl.innerHTML = '<div class="lz-empty">Nie masz aktywnych list.<br>Kliknij „+ Nowa lista", aby zacząć. 🛒</div>';
    return;
  }

  const doKupienia = l.pozycje.filter(x => !x.kupione);
  const wKoszyku = l.pozycje.filter(x => x.kupione);

  const rowHTML = (x, done) => `
    <div class="lz-row ${done ? 'done' : ''} ${x._pending ? 'pending' : ''}" data-id="${x.id}">
      ${done ? '' : '<span class="lz-handle" title="Przytrzymaj i przeciągnij, aby zmienić kolejność">⠿</span>'}
      <div class="lz-check">${done ? '✓' : ''}</div>
      <div style="flex:1;min-width:0">
        <div class="lz-name">${esc(x.nazwa)}</div>
        ${x.dodane_przez ? `<div class="lz-who">dodał(a): ${esc(x.dodane_przez)}</div>` : ''}
      </div>
      <button class="lz-del" data-del="${x.id}" title="Usuń">×</button>
    </div>`;

  let html = `
    <div class="lz-head">
      <h2 class="lz-title">${esc(l.nazwa)}</h2>
      <div class="lz-actions">
        <button data-act="rename" title="Zmień nazwę">✏</button>
        <button data-act="wstrzymaj" title="Wstrzymaj listę">⏸</button>
        <button data-act="zamknij" title="Zamknij (zakończ) listę">✓</button>
        <button data-act="usun" title="Usuń listę" style="color:#c0392b">🗑</button>
      </div>
    </div>
    <div class="lz-add">
      <input id="add-input" type="text" placeholder="Dodaj produkt…" maxlength="200" enterkeyhint="done" autocomplete="off">
      <button id="add-btn" class="btn btn-primary" style="padding:0 20px">Dodaj</button>
    </div>
    ${doKupienia.length >= 2 ? `<div style="margin:0 0 10px">
      <button id="uloz-btn" class="btn btn-outline btn-sm">🧭 Poukładaj</button>
    </div>` : ''}`;

  if (!l.pozycje.length) {
    html += '<div class="lz-empty">Lista pusta — dodaj pierwszy produkt. 🛒</div>';
  } else {
    html += `<div id="lz-do">${doKupienia.map(x => rowHTML(x, false)).join('')}</div><div id="lz-koszyk">`;
    if (wKoszyku.length) {
      html += `<div class="lz-sekcja">W koszyku (${wKoszyku.length})</div>`;
      html += wKoszyku.map(x => rowHTML(x, true)).join('');
      html += `<button id="clear-btn" class="btn btn-outline btn-sm" style="margin-top:10px">Usuń kupione (${wKoszyku.length})</button>`;
    }
    html += '</div>';
  }
  panelEl.innerHTML = html;

  // przywróć pole dodawania
  if (prevVal !== null) {
    const na = document.getElementById('add-input');
    if (na) { na.value = prevVal; if (hadFocus) { na.focus(); try { na.setSelectionRange(na.value.length, na.value.length); } catch {} } }
  }

  // akcje listy
  panelEl.querySelector('[data-act="rename"]').addEventListener('click', () => zmienNazwe(l.id));
  panelEl.querySelector('[data-act="wstrzymaj"]').addEventListener('click', () => zmienStatus(l.id, 'wstrzymana'));
  panelEl.querySelector('[data-act="zamknij"]').addEventListener('click', () => zmienStatus(l.id, 'zamknieta'));
  panelEl.querySelector('[data-act="usun"]').addEventListener('click', () => usunListe(l.id));

  // dodawanie pozycji
  document.getElementById('add-btn').addEventListener('click', () => addItem(l.id));
  document.getElementById('add-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(l.id); } });
  document.getElementById('uloz-btn')?.addEventListener('click', () => poukladaj(l.id));

  // odhaczanie / usuwanie pozycji
  panelEl.querySelectorAll('.lz-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.lz-del') || e.target.closest('.lz-handle')) return;
      const it = l.pozycje.find(x => String(x.id) === String(row.dataset.id));
      if (it && !it._pending) toggle(it);
    });
  });
  panelEl.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); del(btn.dataset.del); }));
  const clearBtn = document.getElementById('clear-btn');
  if (clearBtn) clearBtn.addEventListener('click', () => clearKupione(l.id));

  // przeciąganie kolejności (tylko sekcja "do kupienia")
  if (sortable) { sortable.destroy(); sortable = null; }
  const doEl = document.getElementById('lz-do');
  if (doEl && window.Sortable) {
    sortable = window.Sortable.create(doEl, {
      animation: 150, delay: 220, delayOnTouchOnly: true, touchStartThreshold: 6,
      forceFallback: true, fallbackTolerance: 4, ghostClass: 'lz-drag-ghost',
      onEnd: () => saveOrder(l.id),
    });
  }
}

function renderArch() {
  const arch = stan.filter(l => l.status !== 'aktywna');
  if (!arch.length) { archEl.innerHTML = ''; return; }
  const ety = l => l.status === 'wstrzymana' ? '⏸ wstrzymana' : '✓ zamknięta';
  archEl.innerHTML = `
    <details class="card" style="margin-top:16px">
      <summary style="cursor:pointer;font-weight:600;font-size:14px">Wstrzymane i zamknięte (${arch.length})</summary>
      <div style="margin-top:10px">
        ${arch.map(l => `
          <div class="lz-arch-row">
            <span style="flex:1">${esc(l.nazwa)} <span style="color:var(--muted);font-size:12px">· ${ety(l)} · ${l.pozycje.length} poz.</span></span>
            <button data-wznow="${l.id}" class="btn btn-outline btn-sm">Wznów</button>
            <button data-del-lista="${l.id}" class="btn btn-danger btn-sm">Usuń</button>
          </div>`).join('')}
      </div>
    </details>`;
  archEl.querySelectorAll('[data-wznow]').forEach(b => b.addEventListener('click', () => {
    selId = parseInt(b.dataset.wznow); localStorage.setItem('listaSel', String(selId));
    zmienStatus(selId, 'aktywna');
  }));
  archEl.querySelectorAll('[data-del-lista]').forEach(b => b.addEventListener('click', () => usunListe(parseInt(b.dataset.delLista))));
}

// ── operacje na listach (rzadkie → po zapisie zawsze pełny refresh) ──

async function nowaLista() {
  const nazwa = (prompt('Nazwa nowej listy:') || '').trim();
  if (!nazwa) return;
  try {
    const res = await authFetch('/api/listy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nazwa }) });
    if (!res.ok) throw new Error();
    const nowa = await res.json();
    selId = nowa.id; localStorage.setItem('listaSel', String(selId));
    await refresh();
  } catch { alert('Nie udało się utworzyć listy.'); }
}

async function zmienNazwe(id) {
  const l = listaById(id); if (!l) return;
  const nazwa = (prompt('Nazwa listy:', l.nazwa) || '').trim();
  if (!nazwa || nazwa === l.nazwa) return;
  await patchLista(id, { nazwa });
}

async function zmienStatus(id, status) { await patchLista(id, { status }); }

async function patchLista(id, body) {
  try {
    const res = await authFetch('/api/listy/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error();
  } catch { alert('Nie udało się zapisać zmiany.'); }
  await refresh();
}

async function usunListe(id) {
  const l = listaById(id);
  const nazwa = l ? l.nazwa : 'tę listę';
  if (!confirm(`Usunąć listę „${nazwa}" wraz z pozycjami? Tego nie da się cofnąć.`)) return;
  try {
    const res = await authFetch('/api/listy/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    if (selId === id) selId = null;
  } catch { alert('Nie udało się usunąć listy.'); }
  await refresh();
}

// ── operacje na pozycjach (optymistyczne) ──

async function addItem(listId) {
  const ai = document.getElementById('add-input');
  if (!ai) return;
  const nazwa = ai.value.trim();
  if (!nazwa) return;
  ai.value = '';
  const l = listaById(listId);
  if (!l) return;
  const temp = { id: 'tmp-' + Date.now(), lista_id: listId, nazwa, kupione: false, dodane_przez: null, _pending: true };
  l.pozycje.push(temp);
  renderAll();
  document.getElementById('add-input')?.focus();
  try {
    const res = await authFetch('/api/listy/' + listId + '/pozycje', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nazwa }) });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch {
    l.pozycje = l.pozycje.filter(x => x.id !== temp.id);
    renderAll();
    alert('Nie udało się dodać. Sprawdź połączenie.');
  }
}

async function toggle(it) {
  if (String(it.id).startsWith('tmp-')) return;
  it.kupione = !it.kupione;
  renderAll();
  try {
    const res = await authFetch('/api/pozycje/' + it.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kupione: it.kupione }) });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch { it.kupione = !it.kupione; renderAll(); }
}

async function del(id) {
  if (String(id).startsWith('tmp-')) return;
  const l = selected();
  if (!l) return;
  const before = l.pozycje;
  l.pozycje = l.pozycje.filter(x => String(x.id) !== String(id));
  renderAll();
  try {
    const res = await authFetch('/api/pozycje/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch { l.pozycje = before; renderAll(); }
}

async function clearKupione(listId) {
  const l = listaById(listId);
  if (!l) return;
  const before = l.pozycje;
  l.pozycje = l.pozycje.filter(x => !x.kupione);
  renderAll();
  try {
    const res = await authFetch('/api/listy/' + listId + '/wyczysc-kupione', { method: 'POST' });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch { l.pozycje = before; renderAll(); }
}

async function saveOrder(listId) {
  const doEl = document.getElementById('lz-do');
  if (!doEl) return;
  const ids = [...doEl.querySelectorAll('.lz-row')].map(r => r.dataset.id).filter(id => !String(id).startsWith('tmp-'));
  const l = listaById(listId);
  if (!l) return;
  const pos = new Map(ids.map((id, i) => [String(id), i]));
  l.pozycje.sort((a, b) => {
    const ka = a.kupione ? 1 : 0, kb = b.kupione ? 1 : 0;
    if (ka !== kb) return ka - kb;
    if (!a.kupione) return (pos.get(String(a.id)) ?? 0) - (pos.get(String(b.id)) ?? 0);
    return 0;
  });
  try {
    const res = await authFetch('/api/listy/' + listId + '/kolejnosc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: ids.map(Number) }) });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch { await refresh(); }
}

async function refresh() {
  try {
    const data = await authFetch('/api/listy').then(r => r.json());
    if (Array.isArray(data)) { stan = data; renderAll(); }
  } catch {}
}

// ── Układanie listy wg kolejności działów (ustawienia z panelu admina) ──

async function poukladaj(listId) {
  const btn = document.getElementById('uloz-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Układam…'; }
  try {
    const res = await authFetch('/api/listy/' + listId + '/poukladaj', { method: 'POST' });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch {
    alert('Nie udało się poukładać listy.');
    if (btn) { btn.disabled = false; btn.textContent = '🧭 Poukładaj'; }
  }
}

async function _otworzKalibracje_NIEUZYWANE(listId, sklep) {
  let produkty = [];
  try {
    const r = await authFetch('/api/kalibracja/produkty?sklep=' + encodeURIComponent(sklep)).then(x => x.json());
    produkty = r.produkty || [];
  } catch {}
  if (!produkty.length) produkty = ['warzywa', 'owoce', 'pieczywo', 'nabiał', 'mięso', 'wędliny', 'napoje', 'słodycze', 'mrożonki', 'chemia', 'higiena'];

  let pool = produkty.slice();
  let ordered = [];

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.3);padding:20px 22px">
      <h3 style="margin:0 0 6px;font-size:1.1rem;color:#1a1f2e">Ustaw kolejność — ${esc(sklep)}</h3>
      <p style="font-size:13px;color:#555;line-height:1.5;margin:0 0 12px">Klikaj produkty w kolejności, w jakiej mijasz je w sklepie (od wejścia do kasy). Czego nie klikniesz — pomijasz. To jednorazowa baza; potem apka sama się dostraja.</p>
      <div id="kal-ordered"></div>
      <div id="kal-pool"></div>
      <div style="display:flex;gap:6px;margin-top:12px">
        <input id="kal-add" placeholder="+ dodaj własny produkt" maxlength="40"
          style="flex:1;min-width:0;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none">
        <button id="kal-add-btn" class="btn btn-outline btn-sm">Dodaj</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="kal-save" class="btn btn-primary" style="flex:1">Zapisz kolejność</button>
        <button id="kal-cancel" class="btn btn-outline">Anuluj</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const orderedEl = overlay.querySelector('#kal-ordered');
  const poolEl = overlay.querySelector('#kal-pool');

  function render() {
    orderedEl.innerHTML = (ordered.length
      ? '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 6px">Twoja kolejność (kliknij, by usunąć)</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">'
        + ordered.map((p, i) => `<button class="kal-chip kal-on" data-ord="${i}"><b>${i + 1}.</b> ${esc(p)} ✕</button>`).join('')
        + '</div>'
      : '<div style="font-size:12px;color:var(--muted);margin:4px 0 12px">Jeszcze nic nie wybrano — klikaj produkty poniżej.</div>');
    poolEl.innerHTML = '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 6px">Produkty (kliknij, by dodać do kolejności)</div>'
      + (pool.length
        ? '<div style="display:flex;flex-wrap:wrap;gap:6px">' + pool.map((p, i) => `<button class="kal-chip" data-pool="${i}">${esc(p)}</button>`).join('') + '</div>'
        : '<div style="font-size:12px;color:var(--muted)">Wszystko dodane.</div>');
    orderedEl.querySelectorAll('[data-ord]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.ord; pool.push(ordered[i]); ordered.splice(i, 1); render();
    }));
    poolEl.querySelectorAll('[data-pool]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.pool; ordered.push(pool[i]); pool.splice(i, 1); render();
    }));
  }
  render();

  const dodaj = () => {
    const inp = overlay.querySelector('#kal-add');
    const v = (inp.value || '').trim().toLowerCase();
    if (v && !ordered.includes(v) && !pool.includes(v)) ordered.push(v);
    inp.value = ''; render(); inp.focus();
  };
  overlay.querySelector('#kal-add-btn').addEventListener('click', dodaj);
  overlay.querySelector('#kal-add').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); dodaj(); } });
  overlay.querySelector('#kal-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#kal-save').addEventListener('click', async () => {
    if (ordered.length < 2) { alert('Kliknij co najmniej 2 produkty w kolejności obchodu.'); return; }
    try {
      const res = await authFetch('/api/kalibracja', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sklep, nazwy: ordered }),
      });
      if (!res.ok) throw new Error();
    } catch { alert('Nie udało się zapisać kolejności.'); return; }
    overlay.remove();
    try {
      await authFetch('/api/listy/' + listId + '/uloz', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sklep }),
      });
    } catch {}
    if (!wsOpen()) await refresh();
  });
}

// ── WebSocket: push na żywo + samo-naprawianie ──

function connectWs() {
  if (!wsWanted) return;
  setStatus('wait');
  authGetToken().then(token => {
    if (!wsWanted) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try { ws = new WebSocket(`${proto}://${location.host}/ws/lista?token=${encodeURIComponent(token)}`); }
    catch { scheduleReconnect(); return; }
    ws.onopen = () => { setStatus('online'); startPing(); };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.typ === 'stan') { stan = m.listy || []; renderAll(); }
    };
    ws.onclose = () => { setStatus('offline'); stopPing(); scheduleReconnect(); };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }).catch(() => { setStatus('offline'); scheduleReconnect(); });
}

function scheduleReconnect() {
  if (!wsWanted) return;
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connectWs, 2500);
}
function startPing() { stopPing(); pingTimer = setInterval(() => { if (wsOpen()) { try { ws.send('ping'); } catch {} } }, 25000); }
function stopPing() { clearInterval(pingTimer); }
function startPoll() { clearInterval(pollTimer); pollTimer = setInterval(() => { if (!wsOpen()) refresh(); }, 15000); }

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    refresh();
    if (!wsOpen()) { clearTimeout(reconnectTimer); connectWs(); }
  }
});
window.addEventListener('beforeunload', () => { wsWanted = false; try { ws && ws.close(); } catch {} });

window.addEventListener('DOMContentLoaded', () => {
  authRequireHousehold().then(() => { refresh(); connectWs(); startPoll(); });
});
</script>
</body>
