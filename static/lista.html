<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista zakupów — Budżet domowy</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4f7ef8">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://securetoken.googleapis.com">
  <style>
    .lz-add { display:flex; gap:8px; margin-bottom:8px; }
    .lz-add input { flex:1; min-width:0; padding:13px 15px; border:1px solid var(--border); border-radius:12px; font-size:16px; outline:none; }
    .lz-status { font-size:12.5px; color:var(--muted); margin:2px 2px 18px; display:flex; align-items:center; gap:6px; }
    .lz-dot { width:9px; height:9px; border-radius:50%; background:#bbb; flex:none; }
    .lz-dot.on { background:#22b866; }
    .lz-dot.wait { background:#f0ad3c; animation:lzpulse 1s infinite; }
    @keyframes lzpulse { 50% { opacity:.35; } }
    .lz-row { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px; background:var(--card,#fff);
              border:1px solid var(--border); margin-bottom:5px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
    .lz-row:active { transform:scale(.995); }
    .lz-handle { flex:none; color:#b7bece; font-size:16px; cursor:grab; padding:0 1px; line-height:1; touch-action:none; }
    .lz-check { width:21px; height:21px; border-radius:50%; border:2px solid #cfd6e4; flex:none; display:flex; align-items:center;
                justify-content:center; font-size:13px; color:#fff; }
    .lz-row.done .lz-check { background:#22b866; border-color:#22b866; }
    .lz-name { flex:1; font-size:15px; line-height:1.25; word-break:break-word; }
    .lz-who { font-size:11px; color:var(--muted); }
    .lz-row.done .lz-name { text-decoration:line-through; color:var(--muted); }
    .lz-del { flex:none; width:30px; height:30px; border:none; background:none; color:#c0392b; font-size:19px; cursor:pointer;
              border-radius:8px; line-height:1; }
    .lz-row.pending { opacity:.55; }
    .lz-drag-ghost { opacity:.35; }
    .lz-sekcja { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 2px 8px; }
    .lz-empty { text-align:center; color:var(--muted); padding:32px 12px; font-size:15px; }
  </style>
</head>
<body>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script defer src="/static/auth.js"></script>
<nav>
  <a href="/" class="logo">🏠 Budżet</a>
  <a href="/">Dashboard</a>
  <a href="/upload">Dodaj wydatek</a>
  <a href="/lista" class="active">Lista</a>
  <a href="/konta">Konta</a>
  <a href="/kategorie">Kategorie</a>
  <a href="/analiza">Analiza</a>
  <a href="/powiadomienia">Powiadomienia</a>
  <button onclick="authLogout()" style="margin-left:auto;padding:6px 14px;cursor:pointer;border:1px solid #ccc;border-radius:6px;background:white;font-size:0.85rem;">Wyloguj</button>
</nav>

<main style="max-width:640px">
  <h1 style="margin-bottom:14px">🛒 Lista zakupów</h1>

  <div class="lz-add">
    <input id="add-input" type="text" placeholder="Dodaj produkt… (np. mleko)" maxlength="200" enterkeyhint="done" autocomplete="off">
    <button id="add-btn" class="btn btn-primary" style="padding:0 20px">Dodaj</button>
  </div>
  <div class="lz-status"><span id="lz-dot" class="lz-dot wait"></span><span id="lz-status-txt">Łączę…</span></div>

  <div id="lista-wrap"></div>
</main>

<script>
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let items = [];
let ws = null;
let wsWanted = true;
let reconnectTimer = null;
let pingTimer = null;
let pollTimer = null;
let sortable = null;

const wrap = document.getElementById('lista-wrap');
const addInput = document.getElementById('add-input');
const addBtn = document.getElementById('add-btn');

function wsOpen() { return ws && ws.readyState === 1; }

function setStatus(state) {
  const dot = document.getElementById('lz-dot');
  const txt = document.getElementById('lz-status-txt');
  dot.className = 'lz-dot ' + (state === 'online' ? 'on' : state === 'wait' ? 'wait' : '');
  txt.textContent = state === 'online' ? 'Na żywo — zmiany widać u drugiej osoby od razu'
    : state === 'wait' ? 'Łączę…'
    : 'Offline — próbuję połączyć ponownie';
}

function render() {
  const doKupienia = items.filter(x => !x.kupione);
  const wKoszyku = items.filter(x => x.kupione);

  if (sortable) { sortable.destroy(); sortable = null; }

  if (!items.length) {
    wrap.innerHTML = '<div class="lz-empty">Lista jest pusta.<br>Dodaj pierwszy produkt powyżej. 🛒</div>';
    return;
  }

  const rowHTML = (x, done) => `
    <div class="lz-row ${done ? 'done' : ''} ${x._pending ? 'pending' : ''}" data-id="${x.id}">
      ${done ? '' : '<span class="lz-handle" title="Przytrzymaj i przeciągnij, aby zmienić kolejność">⠿</span>'}
      <div class="lz-check">${done ? '✓' : ''}</div>
      <div style="flex:1;min-width:0">
        <div class="lz-name">${esc(x.nazwa)}</div>
        ${x.dodane_przez ? `<div class="lz-who">dodał(a): ${esc(x.dodane_przez)}</div>` : ''}
      </div>
      <button class="lz-del" data-del="${x.id}" title="Usuń">×</button>
    </div>`;

  let html = `<div id="lz-do">${doKupienia.map(x => rowHTML(x, false)).join('')}</div>`;
  html += '<div id="lz-koszyk">';
  if (wKoszyku.length) {
    html += `<div class="lz-sekcja">W koszyku (${wKoszyku.length})</div>`;
    html += wKoszyku.map(x => rowHTML(x, true)).join('');
    html += `<button id="clear-btn" class="btn btn-outline btn-sm" style="margin-top:10px">Usuń kupione (${wKoszyku.length})</button>`;
  }
  html += '</div>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.lz-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.lz-del') || e.target.closest('.lz-handle')) return;
      const it = items.find(x => String(x.id) === String(row.dataset.id));
      if (it && !it._pending) toggle(it);
    });
  });
  wrap.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); del(btn.dataset.del); });
  });
  const clearBtn = document.getElementById('clear-btn');
  if (clearBtn) clearBtn.addEventListener('click', clearKupione);

  const doEl = document.getElementById('lz-do');
  if (doEl && window.Sortable) {
    sortable = window.Sortable.create(doEl, {
      animation: 150,
      // przytrzymanie (ok. 0,2 s) w DOWOLNYM miejscu wiersza = przenoszenie;
      // szybki tap dalej odhacza. Bez celowania w mały uchwyt.
      delay: 220,
      delayOnTouchOnly: true,
      touchStartThreshold: 6,
      forceFallback: true,      // własny silnik drag — czulszy i spójny na telefonie
      fallbackTolerance: 4,
      ghostClass: 'lz-drag-ghost',
      onEnd: saveOrder,
    });
  }
}

async function saveOrder() {
  const doEl = document.getElementById('lz-do');
  if (!doEl) return;
  const ids = [...doEl.querySelectorAll('.lz-row')]
    .map(r => r.dataset.id)
    .filter(id => !String(id).startsWith('tmp-'));
  // uporządkuj lokalnie tak jak w DOM (kupione zostają na dole)
  const pos = new Map(ids.map((id, i) => [String(id), i]));
  items.sort((a, b) => {
    const ka = a.kupione ? 1 : 0, kb = b.kupione ? 1 : 0;
    if (ka !== kb) return ka - kb;
    if (!a.kupione) return (pos.get(String(a.id)) ?? 0) - (pos.get(String(b.id)) ?? 0);
    return 0;
  });
  try {
    const res = await authFetch('/api/lista/kolejnosc', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: ids.map(Number) }),
    });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch { await refresh(); }
}

// ── zapisy (przez HTTP — działają nawet gdy WS chwilowo padnie) ──

async function addItem() {
  const nazwa = addInput.value.trim();
  if (!nazwa) return;
  addInput.value = '';
  addInput.focus();
  const temp = { id: 'tmp-' + Date.now(), nazwa, kupione: false, dodane_przez: null, _pending: true };
  items.push(temp);
  render();
  try {
    const res = await authFetch('/api/lista', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nazwa }),
    });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch {
    items = items.filter(x => x.id !== temp.id);
    render();
    alert('Nie udało się dodać. Sprawdź połączenie i spróbuj ponownie.');
  }
}

async function toggle(it) {
  if (String(it.id).startsWith('tmp-')) return;
  const nowy = !it.kupione;
  it.kupione = nowy;
  render();
  try {
    const res = await authFetch('/api/lista/' + it.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kupione: nowy }),
    });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch {
    it.kupione = !nowy;
    render();
  }
}

async function del(id) {
  if (String(id).startsWith('tmp-')) return;
  const before = items;
  items = items.filter(x => String(x.id) !== String(id));
  render();
  try {
    const res = await authFetch('/api/lista/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch {
    items = before;
    render();
  }
}

async function clearKupione() {
  const before = items;
  items = items.filter(x => !x.kupione);
  render();
  try {
    const res = await authFetch('/api/lista/wyczysc-kupione', { method: 'POST' });
    if (!res.ok) throw new Error();
    if (!wsOpen()) await refresh();
  } catch {
    items = before;
    render();
  }
}

async function refresh() {
  try {
    const data = await authFetch('/api/lista').then(r => r.json());
    if (Array.isArray(data)) { items = data; render(); }
  } catch {}
}

// ── WebSocket: natychmiastowy push zmian + samo-naprawianie ──

function connectWs() {
  if (!wsWanted) return;
  setStatus('wait');
  authGetToken().then(token => {
    if (!wsWanted) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try {
      ws = new WebSocket(`${proto}://${location.host}/ws/lista?token=${encodeURIComponent(token)}`);
    } catch { scheduleReconnect(); return; }
    ws.onopen = () => { setStatus('online'); startPing(); };
    ws.onmessage = ev => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.typ === 'lista') { items = msg.items || []; render(); }
    };
    ws.onclose = () => { setStatus('offline'); stopPing(); scheduleReconnect(); };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }).catch(() => { setStatus('offline'); scheduleReconnect(); });
}

function scheduleReconnect() {
  if (!wsWanted) return;
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connectWs, 2500);
}

function startPing() {
  stopPing();
  pingTimer = setInterval(() => { if (wsOpen()) { try { ws.send('ping'); } catch {} } }, 25000);
}
function stopPing() { clearInterval(pingTimer); }

// zapasowy cichy poll — na wypadek gdyby WS "zawisł" bez zdarzenia onclose
function startPoll() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!wsOpen()) refresh(); }, 15000);
}

// po odblokowaniu ekranu / powrocie do karty — natychmiast odśwież i wznów łącze
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    refresh();
    if (!wsOpen()) { clearTimeout(reconnectTimer); connectWs(); }
  }
});

window.addEventListener('beforeunload', () => { wsWanted = false; try { ws && ws.close(); } catch {} });

addBtn.addEventListener('click', addItem);
addInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });

window.addEventListener('DOMContentLoaded', () => {
  authRequireHousehold().then(() => {
    refresh();      // szybki pierwszy render z REST
    connectWs();    // potem łącze na żywo
    startPoll();    // siatka bezpieczeństwa
  });
});
</script>
</body>
</html>
