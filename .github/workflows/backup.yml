name: Daily backup

on:
  schedule:
    - cron: '0 3 * * *'   # codziennie o 3:00 UTC (5:00 czasu polskiego)
  workflow_dispatch:        # możliwość ręcznego uruchomienia

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj psycopg2
        run: pip install psycopg2-binary

      - name: Eksportuj i zapisz backup
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Pobierz poprzednie pliki backupów z remote (żeby nie gubić historii)
          git remote set-branches origin '*'
          git fetch origin backups 2>/dev/null || true
          git checkout origin/backups -- backups/ 2>/dev/null || true

          # Wygeneruj dzisiejszy backup
          python backup_all.py

          # Zapisz pliki backupów poza repozytorium
          mkdir -p /tmp/backups-save
          cp backups/*.json /tmp/backups-save/ 2>/dev/null || true

          # Utwórz czysty orphan branch tylko z plikami backupów
          git branch -D backups 2>/dev/null || true
          git checkout --orphan backups
          git rm -rf . --quiet
          mkdir -p backups
          cp /tmp/backups-save/*.json backups/

          git add backups/
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push --force origin backups
