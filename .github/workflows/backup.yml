name: Daily backup

on:
  schedule:
    - cron: '0 3 * * *'   # codziennie o 3:00 UTC (5:00 czasu polskiego)
  workflow_dispatch:        # możliwość ręcznego uruchomienia

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj psycopg2
        run: pip install psycopg2-binary

      - name: Eksportuj i zapisz backup
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin backups:refs/remotes/origin/backups 2>/dev/null || true
          git checkout -B backups origin/backups 2>/dev/null || git checkout --orphan backups
          python backup_all.py
          git add backups/
          git diff --staged --quiet && echo "Brak zmian" && exit 0
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push origin backups
